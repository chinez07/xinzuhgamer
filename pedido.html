<!DOCTYPE html>
<html lang="pt-BR" data-mode="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pedido | Bloxzuh</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root { --p:#7c3aed; --bg:#0f0f14; --card:#16161f; --text:#f3f4f6; --muted:#9ca3af; --border:#2a2a36; }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--text)}
    .top{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10}
    .logo{display:flex;align-items:center;gap:8px;text-decoration:none;color:#fff;font-weight:800}
    .logo-i{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#7c3aed,#a855f7);display:flex;align-items:center;justify-content:center}
    .wrap{max-width:640px;margin:0 auto;padding:16px 14px 40px}
    .box{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:14px}
    h1{font-size:1.2rem}
    .muted{color:var(--muted);font-size:0.88rem}
    .row{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--border);font-size:0.9rem}
    .row:last-child{border-bottom:none}
    .badge{display:inline-block;font-size:0.75rem;font-weight:700;padding:4px 10px;border-radius:999px}
    .st-pago,.st-em_entrega{background:rgba(59,130,246,.2);color:#93c5fd}
    .st-concluido{background:rgba(34,197,94,.2);color:#4ade80}
    .st-aguardando_pagamento{background:rgba(245,158,11,.2);color:#fbbf24}
    .st-expirado{background:rgba(239,68,68,.2);color:#f87171}
    .st-cancelado{background:rgba(239,68,68,.15);color:#f87171}
    .btn{padding:10px 14px;border:none;border-radius:10px;background:var(--p);color:#fff;font-weight:700;cursor:pointer;font-size:0.9rem;text-decoration:none;display:inline-block}
    .btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text)}
    .actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
    .chat{display:flex;flex-direction:column;gap:10px;max-height:360px;overflow:auto;padding:8px 0}
    .bubble{max-width:85%;padding:10px 12px;border-radius:12px;font-size:0.9rem;line-height:1.4;word-break:break-word}
    .bubble.me{align-self:flex-end;background:var(--p);color:#fff;border-bottom-right-radius:4px}
    .bubble.them{align-self:flex-start;background:#2a2a36;border-bottom-left-radius:4px}
    .bubble-row{display:flex;align-items:flex-end;gap:8px;max-width:100%}
    .bubble-row.me{align-self:flex-end;flex-direction:row-reverse}
    .bubble-row.them{align-self:flex-start}
    .chat-av{width:28px;height:28px;border-radius:50%;object-fit:cover;flex-shrink:0;background:#7c3aed}
    .chat-av.letter{display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:0.75rem;font-weight:700}
    .bubble .t{font-size:0.7rem;opacity:.75;margin-top:4px}
    .send{display:flex;gap:8px;margin-top:10px}
    .send input{flex:1;padding:12px;border-radius:10px;border:1px solid var(--border);background:#0f0f14;color:var(--text)}
    .thumb{width:100%;border-radius:10px;max-height:140px;object-fit:cover;margin:10px 0}
  </style>
<script>(function(){document.documentElement.setAttribute("data-mode","dark");localStorage.setItem("xinzuh-mode","dark");})();</script></head>
<body>
  <div class="top">
    <a class="logo" href="index.html"><div class="logo-i"><i class="fas fa-bolt"></i></div> Bloxzuh</a>
    <a href="compras.html" style="color:#c4b5fd;text-decoration:none;font-weight:600;font-size:0.9rem">Compras</a>
  </div>
  <div class="wrap" id="page"><p class="muted">Carregando…</p></div>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="js/firebase-auth.js"></script>
  <script src="js/firestore-db.js"></script>
  <script src="js/photos.js"></script>
  <script>
    function bloxzuhStatusLabel(st) {
      var m = {
        aguardando_pagamento: 'Aguardando pagamento',
        pago: 'Pago',
        em_entrega: 'Em entrega',
        concluido: 'Concluído',
        cancelado: 'Cancelado',
        expirado: 'Pix expirado'
      };
      return m[st] || st || '—';
    }

  function money(n){ return 'R$ ' + (Number(n)||0).toFixed(2).replace('.',','); }
  function esc(s){ return String(s||'').replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function label(s){
    return ({
      aguardando_pagamento:'Aguardando pagamento',
      pago:'Pago',
      em_entrega:'Em entrega',
      concluido:'Concluído / Entregue',
      cancelado:'Cancelado'
    })[s] || s;
  }
  function timeAgo(ts){
    if (!ts) return '';
    var diff = Math.max(0, Date.now() - Number(ts));
    var sec = Math.floor(diff/1000);
    if (sec < 10) return 'agora';
    if (sec < 60) return 'há ' + sec + ' segundos';
    var min = Math.floor(sec/60);
    if (min < 60) return 'há ' + min + ' min';
    var hr = Math.floor(min/60);
    if (hr < 24) return 'há ' + hr + ' h';
    var day = Math.floor(hr/24);
    return 'há ' + day + ' d';
  }

  var orderId = '', currentUser = null, order = null;

  async function loadOrder(id){
    var doc = await firebase.firestore().collection('orders').doc(id).get();
    if (!doc.exists) return null;
    return Object.assign({ id: doc.id }, doc.data());
  }
  async function setStatus(status){
    await firebase.firestore().collection('orders').doc(orderId).update({
      status: status,
      updatedAtMs: Date.now()
    });
  }
  async function sendMsg(text){
    var myPhoto = '';
    try {
      myPhoto = (window.BloxzuhPhotos && BloxzuhPhotos.getLocal(currentUser.uid)) || localStorage.getItem('xinzuh-photo') || '';
    } catch (e) {}
    var msg = {
      id: 'm' + Date.now() + Math.random().toString(36).slice(2, 6),
      text: String(text).slice(0, 2000),
      senderUid: currentUser.uid,
      senderName: currentUser.displayName || localStorage.getItem('xinzuh-username') || 'Usuário',
      senderPhoto: myPhoto || '',
      createdAtMs: Date.now(),
      read: false
    };
    var ref = firebase.firestore().collection('orders').doc(orderId);
    // transaction evita sobrescrever mensagem do outro lado
    await firebase.firestore().runTransaction(async function (tx) {
      var snap = await tx.get(ref);
      if (!snap.exists) throw new Error('Pedido não encontrado');
      var data = snap.data() || {};
      var messages = Array.isArray(data.messages) ? data.messages.slice() : [];
      messages.push(msg);
      tx.update(ref, {
        messages: messages,
        updatedAtMs: Date.now(),
        lastMessageAtMs: Date.now()
      });
    });
  }

  function renderChat(){
    var msgs = Array.isArray(order.messages) ? order.messages : [];
    if (!msgs.length) return '<p class="muted">Nenhuma mensagem ainda. Combine a entrega por aqui.</p>';
    return '<div class="chat" id="chatBox">' + msgs.map(function(m){
      var me = m.senderUid === currentUser.uid;
      var photo = m.senderPhoto || '';
      var letter = (m.senderName || '?').charAt(0).toUpperCase();
      var av = photo
        ? '<img class="chat-av" src="' + esc(photo) + '" alt="">'
        : '<span class="chat-av letter">' + letter + '</span>';
      var ticks = '';
      if (me) {
        if (m.read) {
          ticks = ' <span style="color:#60a5fa;letter-spacing:-2px;font-size:0.75rem">✓✓</span>';
        } else {
          ticks = ' <span style="color:#a8a29e;letter-spacing:-1px;font-size:0.75rem">✓</span>';
        }
      }
      return '<div class="bubble-row ' + (me ? 'me' : 'them') + '">' + av +
        '<div class="bubble ' + (me ? 'me' : 'them') + '">' + esc(m.text) +
        '<div class="t">' + esc(m.senderName) + ' · ' + timeAgo(m.createdAtMs) + ticks + '</div></div></div>';
    }).join('') + '</div>';
  }

  async function markMessagesRead(){
    try {
      if (!order || !currentUser) return;
      var msgs = Array.isArray(order.messages) ? order.messages.slice() : [];
      var changed = false;
      for (var i = 0; i < msgs.length; i++) {
        if (msgs[i].senderUid && msgs[i].senderUid !== currentUser.uid && !msgs[i].read) {
          msgs[i] = Object.assign({}, msgs[i], { read: true, readAtMs: Date.now() });
          changed = true;
        }
      }
      if (!changed) return;
      await firebase.firestore().collection('orders').doc(orderId).update({
        messages: msgs,
        updatedAtMs: Date.now()
      });
      order.messages = msgs;
    } catch (e) { console.warn('mark read', e); }
  }

  async function reload(){
    order = await loadOrder(orderId);
    if (order.status === 'aguardando_pagamento' && order.paymentExpiresAtMs && Date.now() >= Number(order.paymentExpiresAtMs)) {
        try {
          await firebase.firestore().collection('orders').doc(order.id).update({ status: 'expirado', expiredAtMs: Date.now(), updatedAtMs: Date.now() });
          order.status = 'expirado';
        } catch (ex) {}
      }
      if (order.status === 'pago' || order.status === 'em_entrega' || order.status === 'concluido') {
        if (typeof fsApplyOrderStock === 'function') await fsApplyOrderStock(order);
      }
      if (order.status === 'concluido' && typeof fsApplyDeliverySale === 'function') {
        await fsApplyDeliverySale(order);
      }
      draw();
  }

  function draw(){
    var o = order;
    var isBuyer = o.buyerUid === currentUser.uid;
    var isSeller = o.sellerUid === currentUser.uid;
    var canChat = o.status === 'pago' || o.status === 'em_entrega' || o.status === 'concluido';
    var canReview = isBuyer && o.status === 'concluido' && !o.reviewed;
    var itemBanner = o.itemName ? ('<div class="box" style="margin-bottom:10px;border-color:#7c3aed"><strong>Item comprado:</strong> '+esc(o.itemName)+'</div>') : '';
    var img = o.adCover ? '<img class="thumb" src="' + o.adCover + '" alt="">' : '';
    var actions = '';
    var waitingPay = o.status === 'aguardando_pagamento' && !(o.paymentExpiresAtMs && Date.now() >= Number(o.paymentExpiresAtMs));
    if (isBuyer && waitingPay) {
      actions += '<a class="btn" href="pagamento.html?id=' + encodeURIComponent(o.id) + '">Pagar com Pix</a>';
      actions += '<button type="button" class="btn btn-ghost" id="btnCancel">Cancelar</button>';
    }
    if (isBuyer && o.status === 'expirado') {
      actions += '<span class="badge" style="background:rgba(239,68,68,.2);color:#f87171">Pix expirado — faça um novo pedido</span>';
    }
    if (isSeller && o.status === 'pago') {
      actions += '<button type="button" class="btn" id="btnDeliver">Marcar em entrega</button>';
    }
    if ((isBuyer || isSeller) && o.status === 'em_entrega') {
      actions += '<button type="button" class="btn" id="btnDone">Confirmar entrega</button>';
    }

    document.getElementById('page').innerHTML = itemBanner +
      '<div class="box">' +
        '<h1>Pedido #' + esc(o.code) + '</h1>' +
        '<p class="muted" style="margin:8px 0"><span class="badge st-' + esc(o.status) + '">' + label(o.status) + '</span></p>' +
        '<div class="row"><span>Total</span><span style="font-weight:800;color:#c4b5fd">' + money(o.total || o.price) + '</span></div>' +
        '<div class="row"><span>Vendedor</span><span>' + esc(o.sellerName) + '</span></div>' +
        '<div class="row"><span>Comprador</span><span>' + esc(o.buyerName) + '</span></div>' +
        img +
        '<div style="font-weight:700">' + esc(o.adTitle) + '</div>' +
        (o.adId ? '<div class="actions"><a class="btn btn-ghost" href="anuncio.html?id=' + encodeURIComponent(o.adId) + '">Ver anúncio</a></div>' : '') +
        '<div class="actions">' + actions + '</div>' +
      '</div>' +
      (o.paymentMethod ? '<div class="box"><h1>Pagamento</h1><div class="row"><span>Método</span><span>Pix</span></div><div class="row"><span>Status</span><span>' + (o.status === 'pago' || o.status === 'em_entrega' || o.status === 'concluido' ? 'Aprovado' : (o.status === 'expirado' ? 'Expirado' : 'Pendente')) + '</span></div></div>' : '') +
      (canChat
        ? ('<div class="box"><h1><span id="chatPresenceDot" style="color:#6b7280">●</span> Chat com o ' + (isBuyer ? 'vendedor' : 'comprador') + '</h1>' +
           renderChat() +
           '<div class="send"><input id="msgIn" placeholder="Digite sua mensagem..."><button type="button" class="btn" id="btnSend"><i class="fas fa-paper-plane"></i></button></div></div>')
        : '<div class="box"><p class="muted">O chat libera após o pagamento ser aprovado. ' +
          (isBuyer && waitingPay ? '<a href="pagamento.html?id=' + encodeURIComponent(o.id) + '" style="color:#c4b5fd">Ir ao pagamento</a>' : (o.status === 'expirado' ? '<span style="color:#f87171">Pagamento expirado</span>' : '')) +
          '</p></div>');

    var b;
    if ((b = document.getElementById('btnCancel'))) b.onclick = async function(){
      if (!confirm('Cancelar pedido?')) return;
      await setStatus('cancelado'); await reload();
    };
    if ((b = document.getElementById('btnDeliver'))) b.onclick = async function(){
      await setStatus('em_entrega'); await reload();
    };
    
    if (isBuyer && o.status === 'concluido' && o.reviewed) {
      var starsDone = Number(o.reviewStars) || 0;
      var doneHtml = '<div class="box" id="reviewBox"><h1>Sua avaliação</h1>' +
        '<div style="color:#fbbf24;font-size:1.4rem;margin:8px 0">' + '★'.repeat(starsDone) + '☆'.repeat(5-starsDone) + '</div>' +
        (o.reviewComment ? ('<p class="muted">' + esc(o.reviewComment) + '</p>') : '<p class="muted">Obrigado por avaliar!</p>') +
        '</div>';
      var _p0 = document.getElementById('page') || document.getElementById('app');
      if (_p0) _p0.insertAdjacentHTML('beforeend', doneHtml);
    }
    if (canReview) {
      var itemHint = o.itemName ? ('<p class="muted">Item: <strong style="color:#e5e7eb">' + esc(o.itemName) + '</strong></p>') : '';
      var revHtml = '<div class="box" id="reviewBox" style="border-color:#7c3aed">' +
        '<h1>⭐ Avaliar pedido</h1>' +
        '<p class="muted">Como foi a entrega deste anúncio?</p>' + itemHint +
        '<div id="starPick" style="display:flex;gap:6px;margin:14px 0;justify-content:center">' +
        [1,2,3,4,5].map(function(s){
          return '<button type="button" data-star="'+s+'" aria-label="'+s+' estrelas" style="font-size:2rem;background:0;border:0;cursor:pointer;color:#4b5563;line-height:1;padding:4px">★</button>';
        }).join('') +
        '</div>' +
        '<p id="starLabel" class="muted" style="text-align:center;margin-bottom:10px">5 estrelas — Excelente</p>' +
        '<textarea id="revComment" rows="3" placeholder="Comentário opcional (máx. 500 caracteres)" style="width:100%;padding:12px;border-radius:10px;border:1px solid #2a2a36;background:#0f0f14;color:#fff;margin-bottom:12px;font-family:inherit"></textarea>' +
        '<button type="button" class="btn" id="btnReview" style="width:100%">Enviar avaliação</button></div>';
      var _page = document.getElementById('page') || document.getElementById('app');
      if (_page) _page.insertAdjacentHTML('beforeend', revHtml);
      var picked = 5;
      var labels = {1:'1 estrela — Ruim',2:'2 estrelas — Fraco',3:'3 estrelas — Regular',4:'4 estrelas — Bom',5:'5 estrelas — Excelente'};
      function paintStars() {
        document.querySelectorAll('#starPick [data-star]').forEach(function(btn){
          var s = +btn.getAttribute('data-star');
          btn.style.color = s <= picked ? '#fbbf24' : '#4b5563';
        });
        var lb = document.getElementById('starLabel');
        if (lb) lb.textContent = labels[picked] || '';
      }
      paintStars();
      document.querySelectorAll('#starPick [data-star]').forEach(function(btn){
        btn.onclick = function(){ picked = +btn.getAttribute('data-star'); paintStars(); };
      });
      var _br = document.getElementById('btnReview');
      if (_br) _br.onclick = async function(){
        try {
          this.disabled = true;
          this.textContent = 'Enviando…';
          var fn = typeof fsAddReview === 'function' ? fsAddReview : window.fsAddReview;
          if (typeof fn !== 'function') throw new Error('Sistema de avaliação indisponível. Atualize a página.');
          await fn(order, picked, (document.getElementById('revComment').value||'').trim());
          bloxzuhMsg('Avaliação enviada! Obrigado.', 'ok');
          await reload();
        } catch(e) {
          bloxzuhMsg(e.message||'Erro ao avaliar', 'err');
          this.disabled = false;
          this.textContent = 'Enviar avaliação';
        }
      };
    }

    
    // Vendedor avalia comprador
    var isSeller = order && firebase.auth().currentUser && order.sellerUid === firebase.auth().currentUser.uid;
    if (isSeller && o.status === 'concluido' && o.buyerReviewed) {
      var bs = Number(o.buyerReviewStars) || 0;
      var doneB = '<div class="box"><h1>Sua avaliação do comprador</h1>' +
        '<div style="color:#fbbf24;font-size:1.3rem">' + '★'.repeat(bs) + '☆'.repeat(5-bs) + '</div>' +
        (o.buyerReviewComment ? ('<p class="muted">' + esc(o.buyerReviewComment) + '</p>') : '') + '</div>';
      var _pb = document.getElementById('page') || document.getElementById('app');
      if (_pb) _pb.insertAdjacentHTML('beforeend', doneB);
    }
    if (isSeller && o.status === 'concluido' && !o.buyerReviewed) {
      var buyerName = o.buyerName || 'Comprador';
      var revS = '<div class="box" id="buyerReviewBox" style="border-color:#22c55e">' +
        '<h1>⭐ Avaliar comprador</h1>' +
        '<p class="muted">Como foi a negociação com <strong style="color:#e5e7eb">' + esc(buyerName) + '</strong>?</p>' +
        '<div id="starPickBuyer" style="display:flex;gap:6px;margin:14px 0;justify-content:center">' +
        [1,2,3,4,5].map(function(s){ return '<button type="button" data-star="'+s+'" style="font-size:2rem;background:0;border:0;cursor:pointer;color:#4b5563;line-height:1">★</button>'; }).join('') +
        '</div>' +
        '<textarea id="revCommentBuyer" rows="2" placeholder="Comentário opcional" style="width:100%;padding:12px;border-radius:10px;border:1px solid #2a2a36;background:#0f0f14;color:#fff;margin-bottom:12px;font-family:inherit"></textarea>' +
        '<button type="button" class="btn" id="btnReviewBuyer" style="width:100%">Enviar avaliação do comprador</button></div>';
      var _ps = document.getElementById('page') || document.getElementById('app');
      if (_ps) _ps.insertAdjacentHTML('beforeend', revS);
      var pickedB = 5;
      function paintB() {
        document.querySelectorAll('#starPickBuyer [data-star]').forEach(function(btn){
          var s = +btn.getAttribute('data-star');
          btn.style.color = s <= pickedB ? '#fbbf24' : '#4b5563';
        });
      }
      paintB();
      document.querySelectorAll('#starPickBuyer [data-star]').forEach(function(btn){
        btn.onclick = function(){ pickedB = +btn.getAttribute('data-star'); paintB(); };
      });
      var _bb = document.getElementById('btnReviewBuyer');
      if (_bb) _bb.onclick = async function(){
        try {
          this.disabled = true;
          var fn = typeof fsAddBuyerReview === 'function' ? fsAddBuyerReview : window.fsAddBuyerReview;
          if (typeof fn !== 'function') throw new Error('Função indisponível. Atualize a página.');
          await fn(order, pickedB, (document.getElementById('revCommentBuyer').value||'').trim());
          bloxzuhMsg('Avaliação do comprador enviada!', 'ok');
          await reload();
        } catch(e) { bloxzuhMsg(e.message||'Erro', 'err'); this.disabled = false; }
      };
    }


    if ((b = document.getElementById('btnDone'))) b.onclick = async function(){
      await setStatus('concluido');
      try {
        if (typeof fsApplyDeliverySale === 'function') await fsApplyDeliverySale(order);
        else if (order && order.adId && !order.saleCounted) {
          var aref = firebase.firestore().collection('ads').doc(order.adId);
          var adoc = await aref.get();
          if (adoc.exists) {
            var ad = adoc.data();
            var qty = Number(order.quantity) || 1;
            await aref.update({ sales: (Number(ad.sales)||0) + qty, updatedAtMs: Date.now() });
            await firebase.firestore().collection('orders').doc(orderId).update({ saleCounted: true });
          }
        }
      } catch (e) { console.warn(e); }
      await reload();
    };
    
    // presença + lidas
    (async function(){
      try {
        if (typeof markMessagesRead === 'function') await markMessagesRead();
      } catch (e) {}
      try {
        var otherUid = isBuyer ? order.sellerUid : order.buyerUid;
        var dot = document.getElementById('chatPresenceDot');
        if (dot && otherUid && typeof fsGetProfile === 'function') {
          var op = await fsGetProfile(otherUid);
          var on = (typeof isUserOnline === 'function') ? isUserOnline(op) : false;
          dot.style.color = on ? '#4ade80' : '#ef4444';
          dot.title = on ? 'Online' : 'Offline';
        }
      } catch (e) {}
    })();

    if ((b = document.getElementById('btnSend'))) b.onclick = async function(){
      var t = (document.getElementById('msgIn').value || '').trim();
      if (!t) return;
      b.disabled = true;
      try {
        await sendMsg(t);
        document.getElementById('msgIn').value = '';
        // realtime onSnapshot já atualiza; só reabilita botão
        b.disabled = false;
      } catch (e) {
        bloxzuhMsg(e.message || 'Erro ao enviar', 'err');
        b.disabled = false;
      }
    };
  }

  firebase.auth().onAuthStateChanged(async function(user){
    if (!user) { location.href = 'login.html'; return; }
    currentUser = user;
    orderId = new URLSearchParams(location.search).get('id') || '';
    var page = document.getElementById('page');
    if (!orderId) { page.innerHTML = '<p class="muted">Pedido não encontrado.</p>'; return; }
    try {
      order = await loadOrder(orderId);
      if (!order) { page.innerHTML = '<p class="muted">Pedido não encontrado.</p>'; return; }
      if (order.buyerUid !== user.uid && order.sellerUid !== user.uid) {
        page.innerHTML = '<p class="muted">Você não tem acesso a este pedido.</p>';
        return;
      }
      // preenche fotos faltantes nas mensagens
      if (window.BloxzuhPhotos && order.messages) {
        for (var mi = 0; mi < order.messages.length; mi++) {
          var mm = order.messages[mi];
          if (!mm.senderPhoto && mm.senderUid) {
            mm.senderPhoto = await BloxzuhPhotos.fetch(mm.senderUid) || '';
          }
        }
      }
      draw();
      // tempo real: qualquer mudança no pedido (mensagens, status) atualiza a tela
      if (window.__bzOrderUnsub) { try { window.__bzOrderUnsub(); } catch (e0) {} }
      window.__bzOrderUnsub = firebase.firestore().collection('orders').doc(orderId)
        .onSnapshot(function (doc) {
          if (!doc.exists) return;
          var prevLen = (order && order.messages && order.messages.length) || 0;
          var prevStatus = order && order.status;
          order = Object.assign({ id: doc.id }, doc.data());
          var newLen = (order.messages && order.messages.length) || 0;
          // guarda texto digitado
          var input = document.getElementById('msgIn');
          var draft = input ? input.value : '';
          var chatEl = document.getElementById('chatBox');
          var scrollTop = chatEl ? chatEl.scrollTop : 0;
          var nearBottom = chatEl ? (chatEl.scrollHeight - chatEl.scrollTop - chatEl.clientHeight < 80) : true;
          draw();
          // restaura input
          input = document.getElementById('msgIn');
          if (input && draft) input.value = draft;
          chatEl = document.getElementById('chatBox');
          if (chatEl) {
            if (nearBottom || newLen > prevLen) chatEl.scrollTop = chatEl.scrollHeight;
            else chatEl.scrollTop = scrollTop;
          }
          // marca como lidas se a outra pessoa enviou
          if (newLen > prevLen && typeof markMessagesRead === 'function') {
            markMessagesRead();
          }
        }, function (err) {
          console.warn('order realtime', err);
        });
    } catch (e) {
      page.innerHTML = '<p class="muted">Erro: ' + esc(e.message) + '</p>';
      console.error(e);
    }
  });
  </script>
<div id="siteMsg" style="display:none;position:fixed;left:12px;right:12px;bottom:18px;z-index:9999;padding:12px 14px;border-radius:12px;font-weight:700;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.35)"></div>
<script>
window.bloxzuhMsg = function(t, type) {
  var el = document.getElementById('siteMsg');
  if (!el) { console.log(t); return; }
  el.textContent = t;
  el.style.display = 'block';
  el.style.background = type === 'err' ? '#7f1d1d' : '#14532d';
  el.style.color = '#fff';
  clearTimeout(window.__bzMsgT);
  window.__bzMsgT = setTimeout(function(){ el.style.display = 'none'; }, 3500);
};
</script>
