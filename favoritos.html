<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Favoritos | Bloxzuh</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --primary: #7c3aed; --bg: #0f0f14; --card: #1a1a24; --text: #f3f4f6; --muted: #9ca3af; --border: #2d2d3a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    .top {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 16px; background: #14141c; border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 10;
    }
    .logo { display: flex; align-items: center; gap: 8px; text-decoration: none; color: #fff; font-weight: 800; }
    .logo-i {
      width: 36px; height: 36px; border-radius: 10px;
      background: linear-gradient(135deg,#7c3aed,#a855f7); display:flex; align-items:center; justify-content:center;
    }
    a.link { color: #c4b5fd; text-decoration: none; font-weight: 600; font-size: 0.9rem; }
    .wrap { max-width: 1000px; margin: 0 auto; padding: 20px 16px 48px; }
    h1 { font-size: 1.4rem; margin-bottom: 6px; display: flex; align-items: center; gap: 10px; }
    h1 i { color: #ef4444; }
    .sub { color: var(--muted); margin-bottom: 20px; font-size: 0.95rem; }
    .grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 14px;
    }
    .product-card {
      background: var(--card); border: 1px solid var(--border); border-radius: 14px;
      overflow: hidden; text-decoration: none; color: inherit; display: block;
    }
    .product-img {
      height: 120px; background: #2e1065; display: flex; align-items: center; justify-content: center;
      position: relative; color: #fff; font-size: 1.8rem;
    }
    .product-body { padding: 10px 12px 14px; }
    .product-body h3 { font-size: 0.88rem; margin-bottom: 6px; line-height: 1.3; }
    .product-price { font-weight: 800; color: #c4b5fd; font-size: 1rem; }
    .product-seller { font-size: 0.75rem; color: var(--muted); margin-top: 6px; }

.fav, .fav-btn {
  background: rgba(0,0,0,0.35);
  border: none;
  color: #fff;
  width: 36px; height: 36px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  transition: 0.2s;
}
.fav i, .fav-btn i { font-size: 1rem; pointer-events: none; }
.fav.is-fav, .fav-btn.is-fav {
  background: rgba(239, 68, 68, 0.95);
  color: #fff;
}
.fav.is-fav i, .fav-btn.is-fav i { color: #fff; }
.fav:not(.is-fav) i { color: #fff; opacity: 0.95; }

    .empty {
      text-align: center; padding: 48px 16px; color: var(--muted);
    }
    .empty i { font-size: 2.5rem; color: #ef4444; opacity: 0.5; margin-bottom: 12px; }
    .empty a { color: #c4b5fd; font-weight: 700; }
  </style>
</head>
<body>
  <div class="top">
    <a class="logo" href="index.html"><div class="logo-i"><i class="fas fa-bolt"></i></div> Bloxzuh</a>
    <a class="link" href="index.html">Voltar ao site</a>
  </div>
  <div class="wrap">
    <h1><i class="fas fa-heart"></i> Meus favoritos</h1>
    <p class="sub" id="favCount">Carregando…</p>
    <div class="grid" id="favGrid"></div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="js/firebase-auth.js"></script>
  <script src="js/firestore-db.js"></script>
  <script src="js/photos.js"></script>
  <script src="js/firestore-db.js"></script>
  <script src="js/favs.js"></script>
  <script src="js/experimental.js"></script>
  <script>

function favCard(ad) {
  var st = (ad.raw && ad.raw.status) || ad.status || 'ativo';
  var stock = Number((ad.raw && ad.raw.stock) != null ? ad.raw.stock : ad.stock);
  var blocked = st === 'pausado' || st === 'vendido' || stock <= 0;
  var photo = ad.sellerPhoto || '';
  var initial = (ad.seller || 'V').charAt(0).toUpperCase();
  var av = photo
    ? '<span class="avatar" style="padding:0;overflow:hidden;width:22px;height:22px;border-radius:50%;display:inline-block"><img src="'+photo+'" style="width:100%;height:100%;object-fit:cover"></span>'
    : '<span class="avatar">' + initial + '</span>';
  var badge = blocked ? '<div style="position:absolute;top:8px;left:8px;background:#991b1b;color:#fff;font-size:0.7rem;font-weight:700;padding:4px 8px;border-radius:8px;z-index:2">DESATIVADO</div>' : '';
  var price = (Number(ad.price)||0).toFixed(2).replace('.',',');
  var img = ad.cover ? '<img src="'+ad.cover+'" alt="" style="width:100%;height:100%;object-fit:cover">' : '';
  return '<a href="anuncio.html?id='+encodeURIComponent(ad.id)+'" class="product-card" style="position:relative;opacity:'+(blocked?'0.75':'1')+'">' +
    '<div class="product-img" style="position:relative;overflow:hidden">'+badge+img+'</div>' +
    '<div class="product-body"><h3>'+(ad.title||'')+'</h3>' +
    '<div class="product-price">R$ '+price+'</div>' +
    '<div class="product-seller">'+av+' '+(ad.seller||'')+'</div></div></a>';
}
function createProductCard(ad) {
  const initial = (ad.seller || 'V').charAt(0).toUpperCase();
  const price = (Number(ad.price) || 0).toFixed(2).replace('.', ',');
  const id = String(ad.id);
  const favOn = (typeof isFav === 'function') ? isFav(id) : false;
  const heart = favOn ? 'fas fa-heart' : 'far fa-heart';
  const favCls = favOn ? 'fav is-fav' : 'fav';
  const img = ad.cover
    ? '<img src="' + ad.cover + '" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:12px 12px 0 0">'
    : '<i class="fas ' + (ad.icon || 'fa-gamepad') + '"></i>';
  return (
    '<a href="anuncio.html?id=' + encodeURIComponent(id) + '" class="product-card">' +
      '<div class="product-img ' + (ad.imgClass || 'prod-default') + '" style="overflow:hidden;position:relative">' +
        img +
        '<button class="' + favCls + '" type="button" data-id="' + id + '" title="' + (favOn ? 'Remover dos favoritos' : 'Adicionar aos favoritos') + '" ' +
          'onclick="event.preventDefault();event.stopPropagation();toggleFav(\'' + id + '\', this)">' +
          '<i class="' + heart + '"></i>' +
        '</button>' +
      '</div>' +
      '<div class="product-body">' +
        '<h3>' + escapeHtmlHome(ad.title) + '</h3>' +
        '<div class="product-price">R$ ' + price + '</div>' +
        '<div class="product-seller">' +
          (ad.sellerPhoto
            ? '<span class="avatar" style="padding:0;overflow:hidden;width:22px;height:22px;border-radius:50%;display:inline-block"><img src="' + String(ad.sellerPhoto).replace(/"/g,'') + '" style="width:100%;height:100%;object-fit:cover;display:block"></span> '
            : '<span class="avatar">' + initial + '</span> ') +
          escapeHtmlHome(ad.seller) +
          ' <span class="rating"><i class="fas fa-star"></i> ' + (ad.rating || 5) + '</span>' +
          ' <span>(' + (ad.sold != null ? ad.sold : (ad.sales || 0)) + ')</span>' +
        '</div>' +
      '</div>' +
    '</a>'
  );
}
function escapeHtmlHome(s) {
  return String(s || '').replace(/[&<>"']/g, function (c) {
    return ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' })[c];
  });
}

  (async function () {
    const grid = document.getElementById('favGrid');
    const countEl = document.getElementById('favCount');
    const ids = getFavIds();
    if (!ids.length) {
      countEl.textContent = 'Nenhum favorito ainda.';
      grid.innerHTML = '<div class="empty" style="grid-column:1/-1"><i class="far fa-heart"></i><p>Toque no coração nos anúncios para salvar aqui.</p><p style="margin-top:12px"><a href="anuncios.html">Ver anúncios</a></p></div>';
      return;
    }
    countEl.textContent = ids.length + (ids.length === 1 ? ' anúncio salvo' : ' anúncios salvos');
    grid.innerHTML = '<p style="color:var(--muted)">Carregando anúncios…</p>';
    const ads = [];
    for (const id of ids) {
      try {
        if (typeof fsGetAdById === 'function') {
          const ad = await fsGetAdById(id);
          if (ad) ads.push(ad);
        }
      } catch (e) { console.warn(e); }
    }
    // remove ids that no longer exist
    const valid = ads.map(a => String(a.id));
    setFavIds(getFavIds().filter(id => valid.indexOf(id) >= 0 || ads.length === 0));
    if (!ads.length) {
      countEl.textContent = 'Nenhum favorito disponível.';
      grid.innerHTML = '<div class="empty" style="grid-column:1/-1"><i class="far fa-heart"></i><p>Os anúncios favoritados podem ter sido removidos.</p><p style="margin-top:12px"><a href="anuncios.html">Ver anúncios</a></p></div>';
      return;
    }
    countEl.textContent = ads.length + (ads.length === 1 ? ' anúncio salvo' : ' anúncios salvos');
    
    try {
      if (window.BloxzuhPhotos && BloxzuhPhotos.attachToAds) {
        await BloxzuhPhotos.attachToAds(ads);
      } else {
        var uids = {};
        ads.forEach(function(a){ var u=(a.raw&&a.raw.sellerUid)||a.sellerUid||''; if(u) uids[u]=1; });
        var photos = {};
        await Promise.all(Object.keys(uids).map(async function(uid){
          try {
            var d = await firebase.firestore().collection('profiles').doc(uid).get();
            if (d.exists) {
              var pd = d.data();
              var u = pd.photo || pd.photoURL || '';
              if (u) photos[uid] = u;
            }
          } catch(e){}
        }));
        ads.forEach(function(a){ var u=(a.raw&&a.raw.sellerUid)||a.sellerUid||''; if(photos[u]) a.sellerPhoto=photos[u]; });
      }
    } catch(e){ console.warn(e); }
    grid.innerHTML = ads.map(function(a){ return (typeof favCard==='function'?favCard(a):createProductCard(a)); }).join('');

    syncFavButtonsIn(grid);
  })();
  </script>
</body>
</html>
