<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfil | Bloxzuh</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --primary: #7c3aed; --bg: #0f0f14; --card: #16161f; --text: #f3f4f6; --muted: #9ca3af; --border: #2a2a36; --ok: #22c55e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); }
    .top {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 14px; background: var(--card); border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 20;
    }
    .logo { display:flex; align-items:center; gap:8px; text-decoration:none; color:var(--text); font-weight:800; }
    .logo-i { width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#7c3aed,#a855f7);color:#fff;display:flex;align-items:center;justify-content:center; }
    .wrap { max-width: 720px; margin: 0 auto; padding: 16px 14px 60px; }
    .head { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
    .av {
      width: 64px; height: 64px; border-radius: 50%; background: var(--primary); color:#fff;
      display:flex; align-items:center; justify-content:center; font-size:1.5rem; font-weight:800; overflow:hidden;
    }
    .av img { width:100%; height:100%; object-fit:cover; }
    .on { background:#22c55e; color:#fff; font-size:0.65rem; font-weight:800; padding:2px 6px; border-radius:999px; margin-left:6px; }
    .level { font-size: 0.8rem; color: var(--muted); margin-top: 4px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
    .rating-box { text-align: center; padding: 12px; }
    .rating-box .n { font-size: 2.2rem; font-weight: 800; }
    .stars { color: #fbbf24; margin: 6px 0; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip {
      background: rgba(34,197,94,.15); color: var(--ok); font-size: 0.8rem; font-weight: 700;
      padding: 6px 10px; border-radius: 999px;
    }
    .rep-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; text-align: center; }
    .rep-grid .box { background: var(--bg); border-radius: 12px; padding: 14px 8px; }
    .rep-grid .n { font-size: 1.3rem; font-weight: 800; }
    .rep-grid .k { font-size: 0.75rem; color: var(--muted); margin-top: 4px; }
    .rev { padding: 12px 0; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
    .rev:last-child { border-bottom: none; }
    .rev .meta { font-size: 0.78rem; color: var(--muted); margin-top: 6px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
    .product-card {
      background: var(--bg); border: 1px solid var(--border); border-radius: 12px; overflow: hidden;
      text-decoration: none; color: inherit; display: block;
    }
    .product-img { height: 100px; background: #1e1b4b; display:flex; align-items:center; justify-content:center; overflow:hidden; }
    .product-img img { width:100%; height:100%; object-fit:cover; }
    .product-body { padding: 10px; }
    .product-body h3 { font-size: 0.85rem; margin-bottom: 4px; }
    .product-price { font-weight: 800; color: #c4b5fd; }
    .empty { text-align: center; color: var(--muted); padding: 24px; font-size: 0.9rem; }
    h2 { font-size: 1rem; margin-bottom: 12px; }
    a.back { color: var(--muted); text-decoration: none; font-size: 0.9rem; display: inline-block; margin-bottom: 12px; }
  
    .perfil-slide-wrap { overflow: hidden; touch-action: pan-y; }
    .perfil-slides { display: flex; transition: transform .28s ease; }
    .perfil-slide { min-width: 100%; flex-shrink: 0; }
    .perfil-dots { display: flex; justify-content: center; gap: 6px; margin-top: 12px; }
    .perfil-dots span {
      width: 8px; height: 8px; border-radius: 50%; background: #4b5563; cursor: pointer;
    }
    .perfil-dots span.on { background: var(--primary); }
    .info-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; text-align: left; }
    .info-pair .box { background: var(--bg); border-radius: 12px; padding: 14px; }
    .info-pair .k { font-size: 0.8rem; color: var(--muted); margin-bottom: 4px; }
    .info-pair .v { font-weight: 700; font-size: 0.95rem; }
    .rep-grid .box { cursor: pointer; border: 1px solid transparent; transition: border-color .15s, background .15s; }
    .rep-grid .box.is-on { border-color: var(--primary); background: rgba(124,58,237,.12); }
    .rep-grid .box:active { transform: scale(.98); }
    .pct-pos { color: var(--ok); font-weight: 700; }
    .rep-head { display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-bottom:12px; }
    .rep-head h2 { margin:0; font-size:1.05rem; }
    .recebido-select {
      background: var(--bg); color: var(--text); border: 1px solid var(--border);
      border-radius: 10px; padding: 8px 12px; font-size: 0.85rem; font-weight: 600;
    }
    .recebido-label { font-size: 0.7rem; color: var(--muted); display:block; margin-bottom: 2px; text-align: right; }

</style>
</head>
<body>
  <div class="top">
    <a class="logo" href="index.html"><div class="logo-i"><i class="fas fa-bolt"></i></div> Bloxzuh</a>
    <a href="anuncios.html" style="color:#c4b5fd;text-decoration:none;font-weight:600;font-size:0.9rem">Anúncios</a>
  </div>
  <div class="wrap" id="page"><p class="empty">Carregando perfil…</p></div>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="js/firebase-auth.js"></script>
  <script src="js/firestore-db.js"></script>
  <script>
  (function () {
    function esc(s) {
      return String(s || '').replace(/[&<>"']/g, function (c) {
        return ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' })[c];
      });
    }
    function money(n) {
      return 'R$ ' + (Number(n) || 0).toFixed(2).replace('.', ',');
    }
    async function main() {
      const params = new URLSearchParams(location.search);
      const uid = (params.get('uid') || '').trim();
      let name = params.get('name') || 'Vendedor';
      const page = document.getElementById('page');
      if (!uid && !name) {
        page.innerHTML = '<p class="empty">Perfil não encontrado.</p>';
        return;
      }
      let photo = '';
      try {
        if (uid && typeof fsGetSellerPublic === 'function') {
          const p = await fsGetSellerPublic(uid);
          if (p.name) name = p.name;
          photo = p.photo || p.photoURL || '';
          try {
            var ms = p.createdAtMs || p.memberSinceMs || null;
            var la = p.lastAccessMs || p.updatedAtMs || Date.now();
            if (p.createdAt && p.createdAt.toMillis) ms = p.createdAt.toMillis();
            window.__perfilMeta = {
              memberSince: ms ? new Date(ms).toLocaleDateString('pt-BR') : '—',
              lastAccess: (function(){
                var d = Date.now() - (la || Date.now());
                if (d < 60000) return 'agora';
                if (d < 3600000) return 'há ' + Math.floor(d/60000) + ' min';
                if (d < 86400000) return 'há ' + Math.floor(d/3600000) + ' h';
                if (d < 604800000) return 'há ' + Math.floor(d/86400000) + ' dias';
                return new Date(la).toLocaleDateString('pt-BR');
              })()
            };
          } catch (e2) { window.__perfilMeta = { memberSince: '—', lastAccess: '—' }; }
        }
      } catch (e) {}
      // local fallback only if cloud empty
      try {
        if (!photo && uid) {
          const lp = localStorage.getItem('xinzuh-photo-' + uid);
          if (lp) photo = lp;
        }
      } catch (e) {}

      let ads = [];
      try {
        if (uid && typeof fsGetAdsBySeller === 'function') {
          ads = await fsGetAdsBySeller(uid, 40);
        }
        // fallback: if uid missing, try match by seller name from public list
        if (!ads.length && name && typeof fsGetPublicAds === 'function') {
          const all = await fsGetPublicAds(50);
          ads = all.filter(function (a) {
            return (a.seller || '').toLowerCase() === String(name).toLowerCase();
          });
        }
      } catch (e) {
        console.warn('ads load', e);
      }

      const initial = (name || 'V').charAt(0).toUpperCase();
      const av = photo
        ? '<img src="' + photo + '" alt="">'
        : initial;

      // carrega avaliações do vendedor
      var reviewsAsSeller = [];
      var reviewsAsBuyer = [];
      try {
        if (uid && typeof fsGetSellerReviews === 'function') {
          reviewsAsSeller = await fsGetSellerReviews(uid, 50);
        } else if (uid) {
          var snapR = await firebase.firestore().collection('reviews').where('sellerUid','==',uid).limit(50).get();
          snapR.forEach(function(d){ var r=Object.assign({id:d.id},d.data()); if(r.type!=='buyer') reviewsAsSeller.push(r); });
          reviewsAsSeller.sort(function(a,b){ return (b.createdAtMs||0)-(a.createdAtMs||0); });
        }
        // avaliações que vendedores deram a este usuário como comprador
        if (uid) {
          try {
            var snapB = await firebase.firestore().collection('reviews').where('buyerUid','==',uid).limit(50).get();
            snapB.forEach(function(d){
              var r = Object.assign({ id: d.id }, d.data());
              if (r.type === 'buyer') reviewsAsBuyer.push(r);
            });
            reviewsAsBuyer.sort(function(a,b){ return (b.createdAtMs||0)-(a.createdAtMs||0); });
          } catch (e2) { console.warn('buyer reviews', e2); }
        }
        if (typeof attachReviewerPhotos === 'function') {
          try { reviewsAsSeller = await attachReviewerPhotos(reviewsAsSeller); } catch(e){}
          try { reviewsAsBuyer = await attachReviewerPhotos(reviewsAsBuyer); } catch(e){}
        }
      } catch (e) { console.warn(e); }

      function statsOf(list) {
        var avg = 5.0, pos = 0, neu = 0, neg = 0, sum = 0;
        if (!list.length) return { avg: avg, pos: 0, neu: 0, neg: 0, pct: 0 };
        list.forEach(function(r){
          var s = Number(r.stars)||0;
          sum += s;
          if (s === 5) pos++;
          else if (s === 3 || s === 4) neu++;
          else if (s === 1 || s === 2) neg++;
        });
        avg = Math.round((sum / list.length) * 10) / 10;
        var pct = Math.round((pos / list.length) * 100);
        return { avg: avg, pos: pos, neu: neu, neg: neg, pct: pct };
      }

      // padrão: recebido como vendedor
      var reviews = reviewsAsSeller.slice();
      var st0 = statsOf(reviews);
      var avg = st0.avg, pos = st0.pos, neu = st0.neu, neg = st0.neg;
      var pctPos = st0.pct;

      function rel(ms){
        if (!ms) return '';
        var d = Date.now() - ms;
        if (d < 60000) return 'agora';
        if (d < 3600000) return Math.floor(d/60000) + ' min';
        if (d < 86400000) return Math.floor(d/3600000) + ' h';
        if (d < 604800000) return Math.floor(d/86400000) + ' d';
        return Math.floor(d/604800000) + ' sem';
      }

      var memberSince = '—';
      var lastAccess = 'agora';
      try {
        if (typeof fsGetProfile === 'function' && uid) {
          /* already may have profile */ 
        }
      } catch (e) {}
      // datas do perfil (se vierem no p)
      try {
        if (window.__perfilMeta) {
          if (window.__perfilMeta.memberSince) memberSince = window.__perfilMeta.memberSince;
          if (window.__perfilMeta.lastAccess) lastAccess = window.__perfilMeta.lastAccess;
        }
      } catch (e) {}

      function reviewItemHtml(r) {
        var st = Math.min(5, Math.max(0, Number(r.stars)||0));
        // se for avaliação do vendedor sobre o comprador, quem avalia é o vendedor (from*)
        var isBuyerRev = r.type === 'buyer';
        var nm = isBuyerRev ? (r.fromName || r.sellerName || 'Vendedor') : (r.buyerName || r.fromName || 'Comprador');
        var ph = isBuyerRev ? (r.fromPhoto || '') : (r.buyerPhoto || r.fromPhoto || '');
        var buid = isBuyerRev ? (r.fromUid || r.sellerUid || '') : (r.buyerUid || r.fromUid || '');
        var av2 = ph
          ? ('<img src="'+esc(ph)+'" alt="" style="width:36px;height:36px;border-radius:50%;object-fit:cover">')
          : ('<span style="width:36px;height:36px;border-radius:50%;background:#7c3aed;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:700">'+esc((nm||'?').charAt(0).toUpperCase())+'</span>');
        var nameH = buid
          ? ('<a href="perfil.html?uid='+encodeURIComponent(buid)+'" style="color:inherit;font-weight:700;text-decoration:none">'+esc(nm)+'</a>')
          : ('<strong>'+esc(nm)+'</strong>');
        return '<div class="rev-item" data-stars="'+st+'" style="border-top:1px solid var(--border);padding:12px 0;display:flex;gap:10px">' + av2 +
          '<div style="flex:1"><div style="display:flex;justify-content:space-between;gap:8px">' + nameH +
          '<span style="color:var(--muted);font-size:0.8rem">'+rel(r.createdAtMs)+'</span></div>' +
          '<div style="color:#fbbf24">'+'★'.repeat(st)+'☆'.repeat(5-st)+'</div>' +
          (r.comment ? ('<div style="color:var(--muted);font-size:0.9rem;margin-top:4px">'+esc(r.comment)+'</div>') : '') +
          '</div></div>';
      }

      var reviewsHtml = '';
      if (!reviews.length) {
        reviewsHtml = '<p id="reviewsEmpty" style="color:var(--muted);font-size:0.9rem;text-align:center">Ainda sem avaliações.</p><div id="reviewsFiltered"></div>';
      } else {
        reviewsHtml = '<div id="reviewsFiltered">' + reviews.map(reviewItemHtml).join('') + '</div>';
      }

      var ratingSlide =
        '<div class="perfil-slide rating-box">' +
          '<div class="n">' + avg.toFixed(1) + '</div>' +
          '<div class="stars">' + '★'.repeat(Math.max(0, Math.min(5, Math.round(avg)))) + '☆'.repeat(Math.max(0, 5-Math.round(avg))) + '</div>' +
          '<div style="color:var(--muted);font-size:0.85rem">' +
            (reviews.length
              ? (reviews.length + ' avaliação' + (reviews.length!==1?'ões':'') + ' · <span class="pct-pos">' + pctPos + '% positivas</span>')
              : (ads.length + ' anúncio(s) ativo(s)')) +
          '</div>' +
        '</div>';

      var infoSlide =
        '<div class="perfil-slide">' +
          '<div class="info-pair">' +
            '<div class="box"><div class="k">Membro desde</div><div class="v">' + esc(memberSince) + '</div></div>' +
            '<div class="box"><div class="k">Último acesso</div><div class="v">' + esc(lastAccess) + '</div></div>' +
          '</div>' +
        '</div>';

      page.innerHTML =
        '<a class="back" href="javascript:history.back()">← Voltar</a>' +
        '<div class="head">' +
          '<div class="av">' + av + '</div>' +
          '<div><div style="font-size:1.2rem;font-weight:800">' + esc(name) + ' <span class="on">ON</span></div>' +
          '<div class="level">Vendedor Bloxzuh</div></div>' +
        '</div>' +
        '<div class="card perfil-slide-wrap" id="perfilCarousel">' +
          '<div class="perfil-slides" id="perfilSlides">' + ratingSlide + infoSlide + '</div>' +
          '<div class="perfil-dots"><span class="on" data-dot="0"></span><span data-dot="1"></span></div>' +
        '</div>' +
        '<div class="card"><h2>Verificações</h2><div class="chips">' +
          '<span class="chip"><i class="fas fa-check"></i> Email</span>' +
          '<span class="chip"><i class="fas fa-check"></i> Conta Bloxzuh</span>' +
        '</div></div>' +
        '<div class="card" id="repCard">' +
          '<div class="rep-head">' +
            '<h2>Reputação</h2>' +
            '<div><span class="recebido-label">RECEBIDO COMO</span>' +
            '<select id="recebidoComo" class="recebido-select">' +
              '<option value="vendedor">Vendedor</option>' +
              '<option value="comprador">Comprador</option>' +
            '</select></div>' +
          '</div>' +
          '<div class="rep-grid">' +
          '<div class="box" data-filter="pos" role="button"><div class="n" id="repPos" style="color:var(--ok)">' + pos + '</div><div class="k">Positivas</div></div>' +
          '<div class="box" data-filter="neu" role="button"><div class="n" id="repNeu">' + neu + '</div><div class="k">Neutras</div></div>' +
          '<div class="box" data-filter="neg" role="button"><div class="n" id="repNeg" style="color:#ef4444">' + neg + '</div><div class="k">Negativas</div></div>' +
        '</div><p style="color:var(--muted);font-size:0.8rem;text-align:center;margin-top:10px">Toque para filtrar as avaliações</p></div>' +
        '<div class="card"><h2 id="reviewsTitle">Avaliações recebidas como vendedor</h2>' + reviewsHtml + '</div>' +
        '<div class="card"><h2>Anúncios ativos</h2>' +
        (ads.length
          ? '<div class="grid">' + ads.map(function (a) {
              const img = a.cover
                ? '<img src="' + a.cover + '" alt="">'
                : '<i class="fas fa-gamepad" style="color:#fff;opacity:.5"></i>';
              return '<a class="product-card" href="anuncio.html?id=' + encodeURIComponent(a.id) + '">' +
                '<div class="product-img">' + img + '</div>' +
                '<div class="product-body"><h3>' + esc(a.title) + '</h3><div class="product-price">' + money(a.price) + '</div></div></a>';
            }).join('') + '</div>'
          : '<div class="empty"><i class="fas fa-bullhorn" style="font-size:1.5rem;opacity:.4"></i><p style="margin-top:8px">Nenhum anúncio disponível.</p><p style="font-size:0.85rem">Este vendedor ainda não possui anúncios ativos.</p></div>') +
        '</div>';

      // carrossel (deslizar)
      (function(){
        var slides = document.getElementById('perfilSlides');
        var wrap = document.getElementById('perfilCarousel');
        if (!slides || !wrap) return;
        var idx = 0;
        function go(i){
          idx = Math.max(0, Math.min(1, i));
          slides.style.transform = 'translateX(' + (-idx * 100) + '%)';
          wrap.querySelectorAll('.perfil-dots span').forEach(function(d, j){
            d.classList.toggle('on', j === idx);
          });
        }
        wrap.querySelectorAll('.perfil-dots span').forEach(function(d){
          d.onclick = function(){ go(+d.getAttribute('data-dot')); };
        });
        var x0 = null;
        wrap.addEventListener('touchstart', function(e){ x0 = e.touches[0].clientX; }, {passive:true});
        wrap.addEventListener('touchend', function(e){
          if (x0 == null) return;
          var dx = e.changedTouches[0].clientX - x0;
          if (dx < -40) go(idx + 1);
          else if (dx > 40) go(idx - 1);
          x0 = null;
        }, {passive:true});
      })();

      // filtros de reputação
      (function(){
        var filter = 'all';
        function apply(){
          var items = document.querySelectorAll('#reviewsFiltered .rev-item');
          var shown = 0;
          items.forEach(function(el){
            var st = +el.getAttribute('data-stars');
            var ok = true;
            if (filter === 'pos') ok = st === 5;
            else if (filter === 'neu') ok = st === 3 || st === 4;
            else if (filter === 'neg') ok = st === 1 || st === 2;
            el.style.display = ok ? 'flex' : 'none';
            if (ok) shown++;
          });
          var empty = document.getElementById('reviewsEmptyFilter');
          var box = document.getElementById('reviewsFiltered');
          if (box) {
            var msg = box.querySelector('.filter-empty');
            if (!shown && items.length) {
              if (!msg) {
                msg = document.createElement('p');
                msg.className = 'filter-empty';
                msg.style.cssText = 'color:var(--muted);font-size:0.9rem;text-align:center;padding:12px 0';
                box.appendChild(msg);
              }
              msg.textContent = 'Nenhuma avaliação neste filtro.';
              msg.style.display = 'block';
            } else if (msg) {
              msg.style.display = 'none';
            }
          }
          document.querySelectorAll('.rep-grid .box[data-filter]').forEach(function(b){
            b.classList.toggle('is-on', b.getAttribute('data-filter') === filter);
          });
        }
        document.querySelectorAll('.rep-grid .box[data-filter]').forEach(function(b){
          b.onclick = function(){
            var f = b.getAttribute('data-filter');
            filter = (filter === f) ? 'all' : f; // toque de novo = mostrar todas
            apply();
            var card = document.querySelector('.card h2');
            // scroll até avaliações
            var revCard = document.getElementById('reviewsFiltered');
            if (revCard) revCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
          };
        });
      })();
      // Recebido como: Vendedor | Comprador
      (function(){
        var sel = document.getElementById('recebidoComo');
        if (!sel) return;
        var starFilter = 'all';
        function currentList() {
          return sel.value === 'comprador' ? reviewsAsBuyer : reviewsAsSeller;
        }
        function paintList(list) {
          var box = document.getElementById('reviewsFiltered');
          var title = document.getElementById('reviewsTitle');
          if (title) title.textContent = sel.value === 'comprador'
            ? 'Avaliações recebidas como comprador'
            : 'Avaliações recebidas como vendedor';
          if (!box) return;
          if (!list.length) {
            box.innerHTML = '<p style="color:var(--muted);font-size:0.9rem;text-align:center">Ainda sem avaliações neste modo.</p>';
          } else {
            box.innerHTML = list.map(reviewItemHtml).join('');
          }
          var st = statsOf(list);
          var elp = document.getElementById('repPos');
          var eln = document.getElementById('repNeu');
          var elg = document.getElementById('repNeg');
          if (elp) elp.textContent = st.pos;
          if (eln) eln.textContent = st.neu;
          if (elg) elg.textContent = st.neg;
          // atualiza card de nota do carrossel se existir
          var nEl = document.querySelector('#perfilSlides .rating-box .n');
          var sub = document.querySelector('#perfilSlides .rating-box div[style*="muted"]');
          if (nEl && list.length) nEl.textContent = st.avg.toFixed(1);
          if (sub && list.length) {
            sub.innerHTML = list.length + ' avaliação' + (list.length!==1?'ões':'') +
              ' · <span class="pct-pos">' + st.pct + '% positivas</span>';
          }
          applyStarFilter();
        }
        function applyStarFilter() {
          var items = document.querySelectorAll('#reviewsFiltered .rev-item');
          var shown = 0;
          items.forEach(function(el){
            var st = +el.getAttribute('data-stars');
            var ok = true;
            if (starFilter === 'pos') ok = st === 5;
            else if (starFilter === 'neu') ok = st === 3 || st === 4;
            else if (starFilter === 'neg') ok = st === 1 || st === 2;
            el.style.display = ok ? 'flex' : 'none';
            if (ok) shown++;
          });
          document.querySelectorAll('.rep-grid .box[data-filter]').forEach(function(b){
            b.classList.toggle('is-on', b.getAttribute('data-filter') === starFilter);
          });
        }
        sel.onchange = function(){
          starFilter = 'all';
          paintList(currentList());
        };
        // sobrescreve filtros de estrela para usar lista atual
        document.querySelectorAll('.rep-grid .box[data-filter]').forEach(function(b){
          b.onclick = function(){
            var f = b.getAttribute('data-filter');
            starFilter = (starFilter === f) ? 'all' : f;
            applyStarFilter();
          };
        });
      })();


    }
    main();
  })();
  </script>
</body>
</html>
