<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pagamento Pix | Bloxzuh</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root { --p:#7c3aed; --bg:#0f0f14; --card:#16161f; --text:#f3f4f6; --muted:#9ca3af; --border:#2a2a36; }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--text)}
    .top{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--border)}
    .logo{display:flex;align-items:center;gap:8px;text-decoration:none;color:#fff;font-weight:800}
    .logo-i{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#7c3aed,#a855f7);display:flex;align-items:center;justify-content:center}
    .wrap{max-width:520px;margin:0 auto;padding:20px 14px 60px}
    .box{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:14px}
    h1{font-size:1.25rem;margin-bottom:8px}
    .muted{color:var(--muted);font-size:0.9rem}
    .qr{width:220px;height:220px;margin:16px auto;background:#fff;border-radius:12px;display:flex;align-items:center;justify-content:center;padding:12px}
    .qr img{width:100%;height:100%;object-fit:contain}
    .copy{display:flex;gap:8px;margin-top:12px}
    .copy input{flex:1;padding:10px;border-radius:8px;border:1px solid var(--border);background:#0f0f14;color:var(--text);font-size:0.7rem}
    .btn{padding:12px 14px;border:none;border-radius:10px;background:var(--p);color:#fff;font-weight:700;cursor:pointer}
    .btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text)}
    .ok{color:#4ade80;font-weight:700;text-align:center;margin-top:12px}
    .exp{color:#f87171;font-weight:800;text-align:center;font-size:1.1rem;margin:12px 0}
    .timer{
      text-align:center;margin:12px 0 4px;padding:12px;border-radius:12px;
      background:rgba(124,58,237,.12);border:1px solid rgba(124,58,237,.35);
      font-weight:800;font-size:1.35rem;letter-spacing:0.04em;color:#c4b5fd;
    }
    .timer.warn{background:rgba(245,158,11,.12);border-color:rgba(245,158,11,.4);color:#fbbf24}
    .timer.danger{background:rgba(239,68,68,.12);border-color:rgba(239,68,68,.4);color:#f87171}
    .timer-label{font-size:0.75rem;font-weight:600;color:var(--muted);margin-bottom:4px;letter-spacing:0}
  </style>
</head>
<body>
  <div class="top">
    <a class="logo" href="index.html"><div class="logo-i"><i class="fas fa-bolt"></i></div> Bloxzuh</a>
    <a href="compras.html" style="color:#c4b5fd;text-decoration:none;font-weight:600;font-size:0.9rem">Minhas compras</a>
  </div>
  <div class="wrap" id="app"><p class="muted">Carregando pagamento…</p></div>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="js/firebase-auth.js"></script>
  <script src="js/firestore-db.js"></script>
  <script src="js/mp-config.js"></script>
  <script>
(function(){
  /** Tempo para pagar o Pix (10 minutos) */
  var PIX_TTL_MS = 10 * 60 * 1000;

  var app = document.getElementById('app');
  var params = new URLSearchParams(location.search);
  var id = params.get('id') || '';
  var pollTimer = null;
  var countdownTimer = null;
  var expiredHandled = false;

  function money(n){ return 'R$ ' + (Number(n)||0).toFixed(2).replace('.',','); }
  function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function workerBase(){
    var u = (window.MP_WORKER_URL || '').replace(/\/$/,'');
    return u || '';
  }

  async function getOrder(orderId){
    var doc = await firebase.firestore().collection('orders').doc(orderId).get();
    if (!doc.exists) throw new Error('Pedido não encontrado.');
    return Object.assign({ id: doc.id }, doc.data());
  }

  async function markPaid(orderId){
    await firebase.firestore().collection('orders').doc(orderId).update({
      status: 'pago',
      paidAtMs: Date.now(),
      updatedAtMs: Date.now()
    });
    // Atualiza Disponíveis e Vendidos na hora
    try {
      var odoc = await firebase.firestore().collection('orders').doc(orderId).get();
      if (odoc.exists) {
        var o = Object.assign({ id: odoc.id }, odoc.data());
        if (typeof fsApplyOrderStock === 'function') {
          await fsApplyOrderStock(o);
        } else if (o.adId && !o.stockApplied) {
          var aref = firebase.firestore().collection('ads').doc(o.adId);
          var adoc = await aref.get();
          if (adoc.exists) {
            var ad = adoc.data();
            var qty = Number(o.quantity) || 1;
            var stock = Math.max(0, (Number(ad.stock) || 0) - qty);
            var sold = (Number(ad.sold) != null ? Number(ad.sold) : (Number(ad.sales) || 0)) + qty;
            var patch = { stock: stock, sold: sold, updatedAtMs: Date.now() };
            if (stock <= 0) patch.status = 'pausado';
            await aref.update(patch);
            await firebase.firestore().collection('orders').doc(orderId).update({ stockApplied: true });
          }
        }
      }
    } catch (e) { console.warn('stock on pay', e); }
  }

  async function markExpired(orderId){
    try {
      await firebase.firestore().collection('orders').doc(orderId).update({
        status: 'expirado',
        expiredAtMs: Date.now(),
        updatedAtMs: Date.now()
      });
    } catch (e) { console.warn(e); }
  }

  function formatRemain(ms){
    if (ms <= 0) return '00:00';
    var totalSec = Math.ceil(ms / 1000);
    var m = Math.floor(totalSec / 60);
    var s = totalSec % 60;
    return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
  }

  function stopTimers(){
    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
    if (countdownTimer) { clearInterval(countdownTimer); countdownTimer = null; }
  }

  function showExpiredUI(orderId){
    stopTimers();
    var box = document.getElementById('pixLive');
    if (box) {
      box.innerHTML =
        '<p class="exp"><i class="fas fa-clock"></i> Pix expirado</p>' +
        '<p class="muted" style="text-align:center">O tempo para pagar acabou. O QR Code e o código Pix foram desativados.</p>' +
        '<p class="muted" style="text-align:center;margin-top:8px">Crie um novo pedido pelo anúncio se ainda quiser comprar.</p>';
    }
    var t = document.getElementById('timerBox');
    if (t) {
      t.className = 'timer danger';
      t.innerHTML = '<div class="timer-label">Tempo esgotado</div>00:00';
    }
    var line = document.getElementById('statusLine');
    if (line) line.textContent = 'Status: expirado';
  }

  async function handleExpire(orderId){
    if (expiredHandled) return;
    expiredHandled = true;
    await markExpired(orderId);
    showExpiredUI(orderId);
  }

  function startCountdown(expiresAt, orderId){
    if (countdownTimer) clearInterval(countdownTimer);
    function tick(){
      var left = expiresAt - Date.now();
      var el = document.getElementById('timerBox');
      if (!el) return;
      if (left <= 0) {
        el.className = 'timer danger';
        el.innerHTML = '<div class="timer-label">Tempo esgotado</div>00:00';
        handleExpire(orderId);
        return;
      }
      var cls = 'timer';
      if (left <= 2 * 60 * 1000) cls = 'timer danger';
      else if (left <= 5 * 60 * 1000) cls = 'timer warn';
      el.className = cls;
      el.innerHTML = '<div class="timer-label">Pague em até</div>' + formatRemain(left);
    }
    tick();
    countdownTimer = setInterval(tick, 1000);
  }

  function renderPixUI(o, pix, qrImg, expiresAt){
    var hasWorker = !!workerBase();
    app.innerHTML =
      '<div class="box">' +
        '<h1>Pagamento Pix</h1>' +
        '<p class="muted">Pedido #' + esc(o.code || o.id) + '</p>' +
        '<p style="text-align:center;font-weight:800;font-size:1.2rem;margin:10px 0">' + money(o.total||o.price) + '</p>' +
        '<div class="timer" id="timerBox"><div class="timer-label">Pague em até</div>--</div>' +
        '<div id="pixLive">' +
          '<div class="qr"><img src="' + qrImg + '" alt="QR Pix"></div>' +
          '<p class="muted" style="text-align:center">Escaneie o QR no app do banco ou copie o código:</p>' +
          '<div class="copy"><input id="pixIn" readonly value="' + esc(pix) + '"><button type="button" class="btn" id="btnCopy">Copiar</button></div>' +
        '</div>' +
        '<p class="muted" id="statusLine" style="text-align:center;margin-top:14px">Aguardando pagamento…</p>' +
        '<div id="approvedMsg"></div>' +
        (hasWorker ? '' : '<button type="button" class="btn" style="width:100%;margin-top:12px" id="btnSim">Simular aprovado</button>') +
        '<button type="button" class="btn btn-ghost" style="width:100%;margin-top:8px" id="btnOrder">Ver pedido</button>' +
      '</div>';

    var btnCopy = document.getElementById('btnCopy');
    if (btnCopy) btnCopy.onclick = function(){
      try { navigator.clipboard.writeText(document.getElementById('pixIn').value); alert('Código Pix copiado!'); } catch(e) {}
    };
    document.getElementById('btnOrder').onclick = function(){
      location.href = 'pedido.html?id=' + encodeURIComponent(id);
    };
    var sim = document.getElementById('btnSim');
    if (sim) sim.onclick = async function(){
      stopTimers();
      await markPaid(id);
      location.href = 'pedido.html?id=' + encodeURIComponent(id);
    };

    startCountdown(expiresAt, id);

    if (Date.now() >= expiresAt) {
      handleExpire(id);
      return;
    }

    if (hasWorker && o.mpPaymentId) {
      startPolling(o.mpPaymentId, id, expiresAt);
    }
  }

  function startPolling(paymentId, orderId, expiresAt){
    var base = workerBase();
    if (!base) return;
    if (pollTimer) clearInterval(pollTimer);
    async function tick(){
      if (Date.now() >= expiresAt) {
        await handleExpire(orderId);
        return;
      }
      try {
        var res = await fetch(base + '/status?paymentId=' + encodeURIComponent(paymentId));
        var data = await res.json();
        var line = document.getElementById('statusLine');
        if (line) line.textContent = 'Status: ' + (data.status || '…') + (data.status_detail ? ' (' + data.status_detail + ')' : '');
        if (data.approved) {
          stopTimers();
          if (line) line.textContent = 'Pagamento aprovado!';
          var m = document.getElementById('approvedMsg');
          if (m) m.innerHTML = '<p class="ok">✓ Pix confirmado. Abrindo pedido…</p>';
          await markPaid(orderId);
          setTimeout(function(){ location.href = 'pedido.html?id=' + encodeURIComponent(orderId); }, 800);
        }
      } catch (e) { console.warn(e); }
    }
    tick();
    pollTimer = setInterval(tick, 3000);
  }

  async function ensurePix(o){
    var expiresAt = Number(o.paymentExpiresAtMs) || 0;
    if (o.mpPaymentId && o.pixCopyPaste && expiresAt > Date.now()) {
      var qr = o.pixQrBase64
        ? (String(o.pixQrBase64).indexOf('data:') === 0 ? o.pixQrBase64 : ('data:image/png;base64,' + o.pixQrBase64))
        : ('https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=' + encodeURIComponent(o.pixCopyPaste));
      renderPixUI(o, o.pixCopyPaste, qr, expiresAt);
      return;
    }
    // já expirou no banco
    if (o.status === 'expirado' || (expiresAt && expiresAt <= Date.now() && o.mpPaymentId)) {
      if (o.status !== 'expirado') await markExpired(o.id);
      app.innerHTML =
        '<div class="box">' +
          '<h1>Pagamento Pix</h1>' +
          '<p class="muted">Pedido #' + esc(o.code || o.id) + '</p>' +
          '<p class="exp"><i class="fas fa-clock"></i> Pix expirado</p>' +
          '<p class="muted" style="text-align:center">O tempo para pagar acabou. Gere um novo pedido pelo anúncio.</p>' +
          '<button type="button" class="btn btn-ghost" style="width:100%;margin-top:12px" onclick="location.href=\'pedido.html?id=' + encodeURIComponent(o.id) + '\'">Ver pedido</button>' +
        '</div>';
      return;
    }

    var base = workerBase();
    if (!base) {
      // modo simulação local
      expiresAt = Date.now() + PIX_TTL_MS;
      var fakePix = '00020126BLOXZUH-TEST-' + (o.code || o.id);
      await firebase.firestore().collection('orders').doc(o.id).update({
        pixCopyPaste: fakePix,
        paymentExpiresAtMs: expiresAt,
        updatedAtMs: Date.now()
      });
      o.pixCopyPaste = fakePix;
      o.paymentExpiresAtMs = expiresAt;
      var qr2 = 'https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=' + encodeURIComponent(fakePix);
      renderPixUI(o, fakePix, qr2, expiresAt);
      return;
    }

    app.innerHTML = '<div class="box"><p class="muted">Gerando QR Code Pix…</p></div>';
    var user = firebase.auth().currentUser;
    var email = (o.buyerEmail || o.payerEmail || (user && user.email) || '').trim();
    var name = (o.payerName || o.buyerName || (user && user.displayName) || 'Comprador').trim();
    var cpf = String(o.payerCpf || o.cpf || '').replace(/\D/g, '');
    if (!email) {
      app.innerHTML = '<div class="box"><p class="muted">Sua conta não tem e-mail. Entre com Google ou cadastre um e-mail na conta para pagar com Pix.</p>' +
        '<button class="btn" style="margin-top:12px" onclick="location.href=\'conta.html\'">Minha conta</button></div>';
      return;
    }
    if (cpf.length !== 11) {
      app.innerHTML = '<div class="box"><p class="muted">CPF não encontrado neste pedido. Volte ao checkout e informe o CPF.</p>' +
        '<button class="btn" style="margin-top:12px" onclick="history.back()">Voltar</button></div>';
      return;
    }
    var res = await fetch(base + '/create-pix', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        orderId: o.id,
        amount: Number(o.total != null ? o.total : o.price) || 0,
        description: 'Bloxzuh ' + (o.code || o.id),
        email: email,
        name: name,
        cpf: cpf,
        payerEmail: email,
        payerName: name
      })
    });
    var data = await res.json().catch(function(){ return {}; });
    if (!res.ok || data.error) {
      app.innerHTML = '<div class="box"><p class="muted">Erro ao gerar Pix: ' + esc(data.error || res.status) + '</p>' +
        '<button class="btn" style="margin-top:12px" onclick="location.reload()">Tentar de novo</button></div>';
      return;
    }
    expiresAt = data.date_of_expiration ? Date.parse(data.date_of_expiration) : (Date.now() + PIX_TTL_MS);
    // garante no máximo o TTL do site
    var maxExp = Date.now() + PIX_TTL_MS;
    if (!expiresAt || expiresAt > maxExp) expiresAt = maxExp;

    var pix = data.qr_code || data.pixCopyPaste || '';
    var qrB64 = data.qr_code_base64 || data.pixQrBase64 || '';
    var qrImg = qrB64
      ? (String(qrB64).indexOf('data:') === 0 ? qrB64 : ('data:image/png;base64,' + qrB64))
      : ('https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=' + encodeURIComponent(pix));

    await firebase.firestore().collection('orders').doc(o.id).update({
      mpPaymentId: String(data.paymentId || data.id || ''),
      pixCopyPaste: pix,
      pixQrBase64: qrB64 || '',
      paymentExpiresAtMs: expiresAt,
      updatedAtMs: Date.now()
    });
    o.mpPaymentId = String(data.paymentId || data.id || '');
    o.pixCopyPaste = pix;
    o.paymentExpiresAtMs = expiresAt;
    renderPixUI(o, pix, qrImg, expiresAt);
  }

  firebase.auth().onAuthStateChanged(async function(user){
    if (!user) {
      location.href = 'login.html?redirect=' + encodeURIComponent(location.href);
      return;
    }
    if (!id) {
      app.innerHTML = '<div class="box"><p class="muted">Pedido inválido.</p></div>';
      return;
    }
    try {
      var o = await getOrder(id);
      if (o.buyerUid && o.buyerUid !== user.uid && o.sellerUid !== user.uid) {
        app.innerHTML = '<div class="box"><p class="muted">Sem permissão para este pedido.</p></div>';
        return;
      }
      if (o.status === 'pago' || o.status === 'em_entrega' || o.status === 'concluido') {
        location.href = 'pedido.html?id=' + encodeURIComponent(id);
        return;
      }
      if (o.status === 'cancelado') {
        app.innerHTML = '<div class="box"><p class="exp">Pedido cancelado</p></div>';
        return;
      }
      if (o.status === 'expirado') {
        app.innerHTML =
          '<div class="box">' +
            '<h1>Pagamento Pix</h1>' +
            '<p class="exp"><i class="fas fa-clock"></i> Pix expirado</p>' +
            '<p class="muted" style="text-align:center">O tempo para pagar este pedido acabou.</p>' +
            '<button type="button" class="btn btn-ghost" style="width:100%;margin-top:12px" onclick="location.href=\'compras.html\'">Minhas compras</button>' +
          '</div>';
        return;
      }
      await ensurePix(o);
    } catch (e) {
      console.error(e);
      app.innerHTML = '<div class="box"><p class="muted">' + esc(e.message || 'Erro') + '</p></div>';
    }
  });
})();
  </script>
</body>
</html>
