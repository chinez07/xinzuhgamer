<!DOCTYPE html>
<html lang="pt-BR" data-mode="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin | Bloxzuh</title>
<style>
:root{--p:#7c3aed;--bg:#0f0f14;--card:#16161f;--text:#f3f4f6;--muted:#9ca3af;--border:#2a2a36}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--text)}
.top{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--border)}
.top a{color:#c4b5fd;text-decoration:none}
.wrap{max-width:960px;margin:0 auto;padding:16px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.tabs button{padding:8px 14px;border-radius:999px;border:1px solid var(--border);background:transparent;color:var(--text);cursor:pointer;font-weight:600}
.tabs button.on{background:var(--p);border-color:var(--p);color:#fff}
.box{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:12px}
.box h1{font-size:1.15rem;margin-bottom:12px}
.row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);font-size:.9rem;flex-wrap:wrap;align-items:flex-start}
.row:last-child{border-bottom:0}
.muted{color:var(--muted);font-size:.85rem}
.btn{padding:8px 12px;border:0;border-radius:8px;background:var(--p);color:#fff;font-weight:700;cursor:pointer;font-size:.85rem}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text)}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:.75rem;background:#2a2a36;text-transform:lowercase}
.badge-ok{background:#14532d;color:#bbf7d0}
.badge-wait{background:#713f12;color:#fde68a}
.err{color:#fca5a5;padding:12px;background:#3f1d1d;border-radius:10px;margin-bottom:10px}
.loading{color:var(--muted);padding:20px 0;text-align:center}
</style>
<script>(function(){document.documentElement.setAttribute("data-mode","dark");localStorage.setItem("xinzuh-mode","dark");})();</script></head>
<body>
<div class="top">
  <strong>Admin Bloxzuh</strong>
  <a href="index.html">Site</a>
</div>
<div class="wrap">
  <p class="muted" id="who">Verificando...</p>
  <div class="tabs">
    <button type="button" class="on" data-tab="orders">Pedidos</button>
    <button type="button" data-tab="withdrawals">Saques</button>
    <button type="button" data-tab="ads">Anuncios</button>
  </div>
  <div id="panel"><p class="loading">Carregando...</p></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="js/firebase-auth.js"></script>
<script src="js/admin-config.js"></script>
<script>
(function () {
  var panel = document.getElementById('panel');
  var tab = 'orders';
  var loading = false;

  var adminOk = false;
  function isAdmin(u) {
    var emails = (window.BLOXZUH_ADMIN_EMAILS || []).map(function (e) { return String(e).toLowerCase(); });
    var uids = window.BLOXZUH_ADMIN_UIDS || [];
    if (!u) return false;
    if (u.email && emails.indexOf(String(u.email).toLowerCase()) >= 0) return true;
    if (uids.indexOf(u.uid) >= 0) return true;
    return false;
  }

  function money(n) {
    return 'R$ ' + (Number(n) || 0).toFixed(2).replace('.', ',');
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function badgeClass(st) {
    st = String(st || '').toLowerCase();
    if (st === 'pago' || st === 'aprovado' || st === 'concluido') return 'badge badge-ok';
    if (st === 'processando' || st === 'pendente' || st === 'em_entrega') return 'badge badge-wait';
    return 'badge';
  }

  document.querySelectorAll('.tabs button').forEach(function (b) {
    b.addEventListener('click', function () {
      document.querySelectorAll('.tabs button').forEach(function (x) { x.classList.remove('on'); });
      b.classList.add('on');
      tab = b.getAttribute('data-tab') || 'orders';
      load();
    });
  });

  var cacheOrders = [];
  var cacheWithdrawals = [];
  var cacheAds = [];
  var qOrders = '';
  var qWithdrawals = '';
  var qAds = '';

  function matchQ(item, q, fields) {
    q = String(q || '').trim().toLowerCase();
    if (!q) return true;
    for (var i = 0; i < fields.length; i++) {
      var v = item[fields[i]];
      if (v != null && String(v).toLowerCase().indexOf(q) >= 0) return true;
    }
    return false;
  }

  function searchBox(id, placeholder, value) {
    return '<input type="search" class="search" id="' + id + '" placeholder="' + esc(placeholder) + '" value="' + esc(value || '') + '" autocomplete="off">';
  }

  async function loadOrders() {
    if (!cacheOrders.length) {
      var snap = await firebase.firestore().collection('orders').limit(120).get();
      cacheOrders = [];
      snap.forEach(function (d) { cacheOrders.push(Object.assign({ id: d.id }, d.data())); });
      cacheOrders.sort(function (a, b) { return (b.createdAtMs || 0) - (a.createdAtMs || 0); });
    }
    var list = cacheOrders.filter(function (o) {
      return matchQ(o, qOrders, ['id', 'code', 'adTitle', 'buyerName', 'buyerUid', 'sellerName', 'sellerUid', 'status']);
    });
    var html = '<div class="box"><h1>Pedidos (' + list.length + (qOrders ? ' filtrados' : '') + ')</h1>' +
      searchBox('qOrders', 'Pesquisar pedido por código, título, comprador, vendedor...', qOrders);
    if (!list.length) html += '<p class="muted">Nenhum pedido encontrado.</p>';
    list.forEach(function (o) {
      html += '<div class="row"><div><strong>#' + esc(o.code || o.id) + '</strong> ' + esc(o.adTitle || '') +
        '<div class="muted">' + esc(o.buyerName || o.buyerUid) + ' → ' + esc(o.sellerName || o.sellerUid) +
        ' · ' + money(o.total != null ? o.total : o.price) + '</div></div>' +
        '<span class="' + badgeClass(o.status) + '">' + esc(o.status || '—') + '</span></div>';
    });
    html += '</div>';
    panel.innerHTML = html;
    var inp = document.getElementById('qOrders');
    if (inp) {
      inp.addEventListener('input', function () {
        qOrders = inp.value;
        loadOrders();
      });
      try { inp.focus(); var v = inp.value; inp.value = ''; inp.value = v; } catch (e) {}
    }
  }

  async function loadWithdrawals() {
    if (!cacheWithdrawals.length) {
      var snap = await firebase.firestore().collection('withdrawals').limit(120).get();
      cacheWithdrawals = [];
      snap.forEach(function (d) { cacheWithdrawals.push(Object.assign({ id: d.id }, d.data())); });
      cacheWithdrawals.sort(function (a, b) { return (b.createdAtMs || 0) - (a.createdAtMs || 0); });
    }
    var list = cacheWithdrawals.filter(function (w) {
      return matchQ(w, qWithdrawals, ['id', 'userId', 'userName', 'userEmail', 'pixKey', 'nome', 'cpf', 'status', 'mode']);
    });
    var html = '<div class="box"><h1>Saques (' + list.length + (qWithdrawals ? ' filtrados' : '') + ')</h1>' +
      searchBox('qWithdrawals', 'Pesquisar saque por código, Pix, nome, usuário...', qWithdrawals) +
      '<p class="muted" style="margin-bottom:12px">Defina <strong>Normal</strong> ou <strong>Turbo</strong>. Depois de enviar o Pix, clique em <strong>Marcar pago</strong>.</p>';
    if (!list.length) html += '<p class="muted">Nenhum saque ainda.</p>';
    list.forEach(function (w) {
      var st = String(w.status || 'processando');
      var mode = (w.mode === 'turbo') ? 'turbo' : 'normal';
      var canPay = st === 'pendente' || st === 'processando' || st === 'aprovado';
      html += '<div class="row"><div><strong>' + esc(w.id) + '</strong> · ' + money(w.amount) +
        (w.fee ? ' <span class="muted">(taxa ' + money(w.fee) + ')</span>' : '') +
        '<div class="muted">' + esc(w.userName || w.userEmail || w.userId || '') +
        (w.pixKey ? ' · Pix: ' + esc(w.pixKey) : '') +
        (w.nome ? ' · ' + esc(w.nome) : '') +
        '</div>' +
        '<div style="margin-top:8px">' +
          '<button type="button" class="mode-btn' + (mode === 'normal' ? ' on' : '') + '" data-mode="normal" data-wid="' + esc(w.id) + '">Normal</button>' +
          '<button type="button" class="mode-btn turbo' + (mode === 'turbo' ? ' on' : '') + '" data-mode="turbo" data-wid="' + esc(w.id) + '">Turbo</button>' +
        '</div></div><div style="text-align:right">' +
        '<span class="' + badgeClass(st) + '">' + esc(st) + ' · ' + (mode === 'turbo' ? 'Turbo' : 'Normal') + '</span>' +
        (canPay ? '<br><button type="button" class="btn" style="margin-top:8px" data-pay="' + esc(w.id) + '">Marcar pago</button>' : '') +
        '</div></div>';
    });
    html += '</div>';
    panel.innerHTML = html;

    var inp = document.getElementById('qWithdrawals');
    if (inp) {
      inp.addEventListener('input', function () {
        qWithdrawals = inp.value;
        loadWithdrawals();
      });
    }

    document.querySelectorAll('[data-mode][data-wid]').forEach(function (btn) {
      if (!adminOk) return;
      btn.addEventListener('click', async function () {
        var wid = btn.getAttribute('data-wid');
        var mode = btn.getAttribute('data-mode') === 'turbo' ? 'turbo' : 'normal';
        btn.disabled = true;
        try {
          var fee = mode === 'turbo' ? 2 : 0;
          await firebase.firestore().collection('withdrawals').doc(wid).update({
            mode: mode,
            fee: fee,
            updatedAtMs: Date.now()
          });
          // atualiza cache local
          cacheWithdrawals.forEach(function (w) {
            if (w.id === wid) { w.mode = mode; w.fee = fee; }
          });
          await loadWithdrawals();
        } catch (e) {
          alert(e.message || 'Erro ao mudar tipo de saque');
          btn.disabled = false;
        }
      });
    });

    document.querySelectorAll('[data-pay]').forEach(function (btn) {
      if (!adminOk) return;
      btn.addEventListener('click', async function () {
        btn.disabled = true;
        try {
          await firebase.firestore().collection('withdrawals').doc(btn.getAttribute('data-pay')).update({
            status: 'pago',
            paidAtMs: Date.now()
          });
          cacheWithdrawals = []; // força reload
          await load();
        } catch (e) {
          alert(e.message || 'Erro');
          btn.disabled = false;
        }
      });
    });
  }

  async function loadAds() {
    if (!cacheAds.length) {
      var snap = await firebase.firestore().collection('ads').limit(120).get();
      cacheAds = [];
      snap.forEach(function (d) { cacheAds.push(Object.assign({ id: d.id }, d.data())); });
      cacheAds.sort(function (a, b) { return (b.createdAtMs || 0) - (a.createdAtMs || 0); });
    }
    var list = cacheAds.filter(function (a) {
      return matchQ(a, qAds, ['id', 'title', 'sellerName', 'sellerUid', 'status', 'category', 'subcategory']);
    });
    var html = '<div class="box"><h1>Anúncios (' + list.length + (qAds ? ' filtrados' : '') + ')</h1>' +
      searchBox('qAds', 'Pesquisar anúncio por código, título, vendedor...', qAds);
    if (!list.length) html += '<p class="muted">Nenhum anúncio encontrado.</p>';
    list.forEach(function (a) {
      var stock = a.stock;
      if (a.items && a.items.length) {
        stock = 0;
        a.items.forEach(function (it) { stock += Number(it.stock) || 0; });
      }
      html += '<div class="row"><div><strong>' + esc(a.title || 'Anúncio') + '</strong>' +
        '<div class="muted">' + esc(a.id) + ' · stock ' + esc(stock) + ' · ' + esc(a.sellerName || a.sellerUid || '') + '</div></div>' +
        '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">' +
        '<span class="' + badgeClass(a.status) + '">' + esc(a.status || 'ativo') + '</span>' +
        (a.status !== 'pausado'
          ? '<button type="button" class="btn btn-ghost" data-pause="' + esc(a.id) + '">Pausar</button>'
          : '<button type="button" class="btn btn-ghost" data-activate="' + esc(a.id) + '">Ativar</button>') +
        '</div></div>';
    });
    html += '</div>';
    panel.innerHTML = html;

    var inp = document.getElementById('qAds');
    if (inp) {
      inp.addEventListener('input', function () {
        qAds = inp.value;
        loadAds();
      });
    }

    document.querySelectorAll('[data-pause]').forEach(function (btn) {
      if (!adminOk) return;
      btn.addEventListener('click', async function () {
        btn.disabled = true;
        try {
          if (!adminOk) { alert('Acesso negado'); return; }
          await firebase.firestore().collection('ads').doc(btn.getAttribute('data-pause')).update({ status: 'pausado' });
          cacheAds = [];
          await load();
        } catch (e) {
          alert(e.message || 'Erro');
          btn.disabled = false;
        }
      });
    });
    document.querySelectorAll('[data-activate]').forEach(function (btn) {
      if (!adminOk) return;
      btn.addEventListener('click', async function () {
        btn.disabled = true;
        try {
          await firebase.firestore().collection('ads').doc(btn.getAttribute('data-activate')).update({ status: 'ativo' });
          cacheAds = [];
          await load();
        } catch (e) {
          alert(e.message || 'Erro');
          btn.disabled = false;
        }
      });
    });
  }

  async function load() {
    if (!adminOk) {
      panel.innerHTML = '<div class="err">Acesso negado.</div>';
      return;
    }
    if (loading) return;
    loading = true;
    panel.innerHTML = '<p class="loading">Carregando ' + (tab === 'orders' ? 'pedidos' : tab === 'withdrawals' ? 'saques' : 'anuncios') + '...</p>';
    try {
      if (tab === 'orders') await loadOrders();
      else if (tab === 'withdrawals') await loadWithdrawals();
      else await loadAds();
    } catch (e) {
      console.error(e);
      panel.innerHTML = '<div class="err"><strong>Erro ao carregar</strong><br>' + esc(e.message || e) +
        '<br><br>Publique as regras do arquivo FIRESTORE-RULES-ADMIN.txt no Firebase (permite o admin ler tudo).</div>';
    } finally {
      loading = false;
    }
  }

  firebase.auth().onAuthStateChanged(function (u) {
    if (!u) {
      location.href = 'login.html?redirect=admin.html';
      return;
    }
    adminOk = isAdmin(u);
    if (!adminOk) {
      document.getElementById('who').textContent = 'Acesso negado. Só o admin pode usar este painel.';
      panel.innerHTML = '<div class="err"><strong>Acesso negado</strong><br>Entre com a conta admin cadastrada em js/admin-config.js.<br>Conta atual: ' + esc(u.email || u.uid) + '</div>';
      document.querySelectorAll('.tabs button').forEach(function (b) { b.disabled = true; b.style.opacity = '0.4'; });
      return;
    }
    document.getElementById('who').textContent = 'Admin: ' + (u.email || u.uid);
    document.querySelectorAll('.tabs button').forEach(function (b) { b.disabled = false; b.style.opacity = '1'; });
    load();
  });
})();
</script>
</body>
</html>
