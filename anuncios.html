<!DOCTYPE html>
<html data-mode="dark" lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anúncios | Bloxzuh</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --primary:#7c3aed; --primary-hover:#6d28d9; --primary-soft:rgba(124,58,237,.12);
      --bg:#0f0f14; --bg-card:#1a1a24; --bg-header:#14141c;
      --text:#f3f4f6; --text-muted:#9ca3af; --border:#2d2d3a; --radius:14px; --warning:#f59e0b;
    }
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#0f0f14;color:var(--text);min-height:100vh}
    a{color:inherit;text-decoration:none}
    img{max-width:100%;display:block}
    .container{max-width:1100px;margin:0 auto;padding:0 16px}
    .header{position:sticky;top:0;z-index:100;background:var(--bg-header);border-bottom:1px solid var(--border)}
    .header-content{display:flex;align-items:center;justify-content:space-between;height:60px;gap:12px}
    .logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:1.2rem}
    .logo-icon{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--primary),#a78bfa);display:flex;align-items:center;justify-content:center;color:#fff}
    .btn-anunciar{background:var(--primary);color:#fff;padding:9px 16px;border-radius:10px;font-weight:600;border:0;cursor:pointer}
    .btn-anunciar:hover{background:var(--primary-hover)}
    .page-head{padding:28px 0 12px}
    .page-head h1{font-size:1.5rem;margin-bottom:4px}
    .page-head p{color:var(--text-muted);font-size:.95rem}
    .filters{display:flex;flex-wrap:wrap;gap:10px;background:var(--bg-card);border:1px solid var(--border);border-radius:14px;padding:14px;margin:12px 0 20px}
    .filters label{display:flex;flex-direction:column;gap:4px;font-size:.72rem;color:var(--text-muted);font-weight:600;letter-spacing:.04em}
    .filters input,.filters select{background:#12121a;border:1px solid var(--border);color:var(--text);border-radius:10px;padding:9px 12px;min-width:140px;font-size:.9rem}
    .filters input:focus,.filters select:focus{outline:none;border-color:var(--primary)}
    .meta{color:var(--text-muted);font-size:.9rem;margin-bottom:14px}
    .products-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;padding-bottom:40px}
    .product-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;transition:.25s;cursor:pointer;display:block}
    .product-card:hover{transform:translateY(-4px);border-color:var(--primary)}
    .product-img{height:140px;position:relative;overflow:hidden;background:linear-gradient(135deg,#4c1d95,#1e1b4b);display:flex;align-items:center;justify-content:center;color:#fff;font-size:2.5rem}
    .product-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
    .product-img .fav{position:absolute;top:10px;right:10px;z-index:2;width:32px;height:32px;border-radius:50%;border:0;background:rgba(255,255,255,.9);color:#9ca3af;cursor:pointer}
    .product-img .fav.is-fav{color:#ef4444}
    .product-body{padding:14px}
    .product-body h3{font-size:.9rem;font-weight:600;margin-bottom:10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.6em}
    .product-price{font-size:1.15rem;font-weight:700;color:var(--primary);margin-bottom:10px}
    .product-seller{display:flex;align-items:center;gap:6px;font-size:.8rem;color:var(--text-muted)}
    .product-seller .avatar{width:22px;height:22px;border-radius:50%;background:var(--primary-soft);color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:.65rem;font-weight:700;overflow:hidden;padding:0}
    .product-seller .avatar img{width:100%;height:100%;object-fit:cover}
    .empty{text-align:center;padding:48px 16px;color:var(--text-muted)}
    .footer{border-top:1px solid var(--border);padding:28px 0;margin-top:20px;color:var(--text-muted);font-size:.85rem}
    @media (max-width:600px){.filters{flex-direction:column}.filters input,.filters select{width:100%;min-width:0}}
  </style>
</head>
<body>
  <header class="header">
    <div class="container header-content">
      <a class="logo" href="index.html"><span class="logo-icon"><i class="fas fa-bolt"></i></span> Bloxzuh</a>
      <a class="btn-anunciar" href="anunciar.html">+ Anunciar</a>
    </div>
  </header>

  <main class="container">
    <div class="page-head">
      <h1>Todos os Anúncios</h1>
      <p>Encontre contas, itens, gold e assinaturas</p>
    </div>

    <div class="filters">
      <label>BUSCAR<input id="fSearch" type="search" placeholder="Nome, jogo, vendedor..."></label>
      <label>CATEGORIA
        <select id="fCat">
          <option value="">Todas</option>
          <option value="roblox">Roblox</option>
          <option value="valorant">Valorant</option>
          <option value="freefire">Free Fire</option>
          <option value="lol">League of Legends</option>
          <option value="fortnite">Fortnite</option>
          <option value="genshin">Genshin Impact</option>
          <option value="cs2">CS2</option>
          <option value="premium">Assinaturas</option>
        </select>
      </label>
      <label>PREÇO MÍN.<input id="fMin" type="number" min="0" step="0.01" value="0"></label>
      <label>PREÇO MÁX.<input id="fMax" type="number" min="0" step="0.01" value="9999"></label>
      <label>ORDENAR
        <select id="fSort">
          <option value="rel">Relevância</option>
          <option value="price_asc">Menor preço</option>
          <option value="price_desc">Maior preço</option>
          <option value="sales">Mais vendidos</option>
        </select>
      </label>
    </div>

    <div class="meta" id="adsMeta">Carregando…</div>
    <div class="products-grid" id="adsList"></div>
  </main>

  <footer class="footer">
    <div class="container">© 2026 Bloxzuh</div>
  </footer>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="js/firebase-auth.js"></script>
  <script src="js/firestore-db.js"></script>
  <script src="js/photos.js"></script>
  <script src="js/favs.js"></script>
  <script src="js/experimental.js"></script>
  <script>
  (function () {
    document.documentElement.setAttribute('data-mode', 'dark');
    var adsData = [];

    function esc(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&').replace(/</g, '<').replace(/>/g, '>')
        .replace(/"/g, '"').replace(/'/g, '&#39;');
    }

    function createProductCard(ad) {
      var initial = (ad.seller || 'V').charAt(0).toUpperCase();
      var price = (Number(ad.price) || 0).toFixed(2).replace('.', ',');
      var id = String(ad.id);
      var favOn = (typeof isFav === 'function') ? isFav(id) : false;
      var heart = favOn ? 'fas fa-heart' : 'far fa-heart';
      var favCls = favOn ? 'fav is-fav' : 'fav';
      var cover = ad.cover || '';
      var img = cover
        ? '<img src="' + esc(cover) + '" alt="" loading="lazy" onerror="this.onerror=null;this.style.display=\'none\'">'
        : '<i class="fas ' + esc(ad.icon || 'fa-gamepad') + '"></i>';
      var photo = ad.sellerPhoto || '';
      var avatar = photo
        ? '<span class="avatar"><img src="' + esc(photo) + '" alt="" onerror="this.parentNode.textContent=\'' + initial + '\'"></span>'
        : '<span class="avatar">' + initial + '</span>';
      return (
        '<a href="anuncio.html?id=' + encodeURIComponent(id) + '" class="product-card">' +
          '<div class="product-img">' + img +
            '<button class="' + favCls + '" type="button" data-id="' + esc(id) + '" onclick="event.preventDefault();event.stopPropagation();if(typeof toggleFav===\'function\')toggleFav(\'' + esc(id) + '\');">' +
              '<i class="' + heart + '"></i></button>' +
          '</div>' +
          '<div class="product-body">' +
            '<h3>' + esc(ad.title || 'Anúncio') + '</h3>' +
            '<div class="product-price">R$ ' + price + '</div>' +
            '<div class="product-seller">' + avatar + '<span>' + esc(ad.seller || 'Vendedor') + '</span></div>' +
          '</div>' +
        '</a>'
      );
    }

    function applyFilters() {
      var q = (document.getElementById('fSearch').value || '').toLowerCase().trim();
      var cat = (document.getElementById('fCat').value || '').toLowerCase();
      var min = Number(document.getElementById('fMin').value) || 0;
      var max = Number(document.getElementById('fMax').value);
      if (isNaN(max) || max <= 0) max = 1e12;
      var sort = document.getElementById('fSort').value;
      var list = adsData.filter(function (ad) {
        if (cat && String(ad.category || '').toLowerCase() !== cat) return false;
        var p = Number(ad.price) || 0;
        if (p < min || p > max) return false;
        if (q) {
          var blob = ((ad.title || '') + ' ' + (ad.seller || '') + ' ' + (ad.categoryLabel || '') + ' ' + (ad.category || '')).toLowerCase();
          if (blob.indexOf(q) < 0) return false;
        }
        return true;
      });
      if (sort === 'price_asc') list.sort(function (a, b) { return (a.price || 0) - (b.price || 0); });
      else if (sort === 'price_desc') list.sort(function (a, b) { return (b.price || 0) - (a.price || 0); });
      else if (sort === 'sales') list.sort(function (a, b) { return (b.sold || b.sales || 0) - (a.sold || a.sales || 0); });
      var grid = document.getElementById('adsList');
      var meta = document.getElementById('adsMeta');
      if (!list.length) {
        grid.innerHTML = '<div class="empty">Nenhum anúncio encontrado.</div>';
        meta.textContent = '0 anúncios';
        return;
      }
      meta.textContent = list.length + (list.length === 1 ? ' anúncio' : ' anúncios');
      grid.innerHTML = list.map(createProductCard).join('');
      if (typeof syncFavButtonsIn === 'function') syncFavButtonsIn(document);
    }

    async function loadAds() {
      try {
        if (typeof fsGetPublicAds !== 'function') {
          document.getElementById('adsMeta').textContent = 'Erro ao carregar (Firebase).';
          return;
        }
        var live = await fsGetPublicAds(80);
        if (typeof attachSellerPhotos === 'function') {
          try { live = await attachSellerPhotos(live); } catch (e) {}
        } else if (window.BloxzuhPhotos && BloxzuhPhotos.attachToAds) {
          try { live = await BloxzuhPhotos.attachToAds(live); } catch (e) {}
        }
        adsData = live || [];
        var params = new URLSearchParams(location.search);
        var cat = params.get('cat') || '';
        if (cat && document.getElementById('fCat')) {
          var opt = document.getElementById('fCat').querySelector('option[value="' + cat + '"]');
          if (opt) document.getElementById('fCat').value = cat;
        }
        var q = params.get('q') || '';
        if (q) document.getElementById('fSearch').value = q;
        applyFilters();
      } catch (e) {
        console.warn(e);
        document.getElementById('adsMeta').textContent = 'Erro ao carregar anúncios.';
      }
    }

    ['fSearch','fCat','fMin','fMax','fSort'].forEach(function (id) {
      var el = document.getElementById(id);
      if (el) el.addEventListener('input', applyFilters);
      if (el) el.addEventListener('change', applyFilters);
    });

    loadAds();
  })();
  </script>
</body>
</html>
