<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minhas Compras | Bloxzuh</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root{--p:#7c3aed;--bg:#0f0f14;--card:#16161f;--text:#f3f4f6;--muted:#9ca3af;--border:#2a2a36}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--text)}
    .top{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--border)}
    .logo{display:flex;align-items:center;gap:8px;text-decoration:none;color:#fff;font-weight:800}
    .logo-i{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#7c3aed,#a855f7);display:flex;align-items:center;justify-content:center}
    .wrap{max-width:720px;margin:0 auto;padding:20px 16px 48px}
    h1{font-size:1.35rem;margin-bottom:4px}
    .sub{color:var(--muted);font-size:0.9rem;margin-bottom:18px}
    .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:12px;text-decoration:none;color:inherit;display:block}
    .row{display:flex;gap:12px}
    .thumb{width:72px;height:72px;border-radius:10px;object-fit:cover;background:#1e1b4b;flex-shrink:0}
    .title{font-weight:700;margin-bottom:4px}
    .meta{font-size:0.82rem;color:var(--muted);line-height:1.45}
    .price{font-weight:800;color:#c4b5fd;margin-top:6px}
    .badge{display:inline-block;font-size:0.72rem;font-weight:700;padding:3px 8px;border-radius:999px;margin-top:6px}
    .st-aguardando_pagamento{background:rgba(245,158,11,.2);color:#fbbf24}
    .st-pago,.st-em_entrega{background:rgba(59,130,246,.2);color:#93c5fd}
    .st-concluido{background:rgba(34,197,94,.2);color:#4ade80}
    .st-cancelado{background:rgba(239,68,68,.15);color:#f87171}
    .empty{text-align:center;padding:40px 16px;color:var(--muted)}
    .btn{display:inline-block;background:var(--p);color:#fff;border:none;border-radius:10px;padding:10px 16px;font-weight:700;text-decoration:none}
  </style>
</head>
<body>
  <div class="top">
    <a class="logo" href="index.html"><div class="logo-i"><i class="fas fa-bolt"></i></div> Bloxzuh</a>
    <a href="index.html" style="color:#c4b5fd;text-decoration:none;font-weight:600">Voltar</a>
  </div>
  <div class="wrap">
    <h1>Minhas Compras</h1>
    <p class="sub">Pedidos que você fez na Bloxzuh.</p>
    <div id="list"><div class="empty">Carregando…</div></div>
  </div>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="js/firebase-auth.js"></script>
  <script>
  function money(n){ return 'R$ '+(Number(n)||0).toFixed(2).replace('.',','); }
  function label(s){ return ({aguardando_pagamento:'Aguardando pagamento',pago:'Pago',em_entrega:'Em entrega',concluido:'Concluído',cancelado:'Cancelado'})[s]||s; }
  function reviewHint(o){ return (o.status==='concluido' && !o.reviewed) ? ' · Avaliar' : (o.reviewed ? ' · Avaliado' : ''); }
  firebase.auth().onAuthStateChanged(async function(user){
    if(!user){ location.href='login.html'; return; }
    var el=document.getElementById('list');
    try{
      var snap=await firebase.firestore().collection('orders').where('buyerUid','==',user.uid).limit(50).get();
      var list=[];
      snap.forEach(function(doc){ list.push(Object.assign({id:doc.id},doc.data())); });
      list.sort(function(a,b){ return (b.createdAtMs||0)-(a.createdAtMs||0); });
      if(!list.length){
        el.innerHTML='<div class="empty"><p>Você ainda não fez nenhum pedido.</p><a class="btn" style="margin-top:14px" href="anuncios.html">Ver anúncios</a></div>';
        return;
      }
      el.innerHTML=list.map(function(o){
        var img=o.adCover?'<img class="thumb" src="'+o.adCover+'" alt="">':'<div class="thumb"></div>';
        return '<a class="card" href="pedido.html?id='+encodeURIComponent(o.id)+'"><div class="row">'+img+'<div><div class="title">'+(o.adTitle||'Pedido')+'</div><div class="meta">#'+(o.code||'')+' · Vendedor: '+(o.sellerName||'')+'</div><div class="price">'+money(o.total||o.price)+'</div><span class="badge st-'+(o.status||'')+'">'+label(o.status) + reviewHint(o)+'</span></div></div></a>';
      }).join('');
    }catch(e){
      el.innerHTML='<div class="empty">Erro: '+(e.message||'')+'</div>';
    }
  });
  </script>
</body>
</html>
