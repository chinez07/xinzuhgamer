<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anúncio | Bloxzuh</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --primary: #7c3aed;
      --primary-soft: rgba(124,58,237,.12);
      --bg: #0f0f14;
      --card: #16161f;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --border: #2a2a36;
      --ok: #22c55e;
    }
    [data-mode="light"] {
      --bg: #f5f3ff; --card: #fff; --text: #1a1a2e; --muted: #6b7280; --border: #e5e7eb;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: var(--bg); color: var(--text); }
    a { color: inherit; }
    .top {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      padding: 10px 14px; background: var(--card); border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 30;
    }
    .logo { display: flex; align-items: center; gap: 8px; text-decoration: none; font-weight: 800; color: var(--text); }
    .logo-i {
      width: 36px; height: 36px; border-radius: 10px;
      background: linear-gradient(135deg,#7c3aed,#a855f7); color:#fff;
      display:flex; align-items:center; justify-content:center;
    }
    .top-actions { display: flex; gap: 8px; align-items: center; }
    .icon-btn {
      width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--border);
      background: transparent; color: var(--text); display:flex; align-items:center; justify-content:center; cursor:pointer;
    }
    .btn-announce {
      background: var(--primary); color: #fff; border: none; border-radius: 999px;
      padding: 10px 16px; font-weight: 700; cursor: pointer; text-decoration: none; font-size: 0.9rem;
    }
    .wrap { max-width: 720px; margin: 0 auto; padding: 16px 14px 80px; }
    .cover {
      width: 100%; border-radius: 16px; overflow: hidden; background: #1e1b4b;
      aspect-ratio: 16/10; display:flex; align-items:center; justify-content:center;
    }
    .cover img { width: 100%; height: 100%; object-fit: cover; }
    .title-row { margin: 16px 0 8px; }
    .title-row h1 { font-size: 1.25rem; line-height: 1.35; }
    .badges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .badge {
      font-size: 0.7rem; font-weight: 700; padding: 3px 8px; border-radius: 6px;
      background: var(--primary-soft); color: var(--primary); text-transform: lowercase;
    }
    .badge.dim { background: #1d4ed8; color: #fff; }
    .stats {
      display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px;
      margin: 16px 0; text-align: center;
    }
    .stat { padding: 10px 6px; }
    .stat .k { font-size: 0.7rem; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
    .stat .v { font-size: 1.15rem; font-weight: 800; margin-top: 4px; }
    .stat .v.plus { color: var(--ok); }
    .fav-float {
      float: right; width: 40px; height: 40px; border-radius: 50%;
      border: 1px solid var(--border); background: var(--card); color: var(--muted);
      display: flex; align-items: center; justify-content: center; cursor: pointer;
    }
    .fav-float.is-fav { color: #fff; background: #ef4444; border-color: #ef4444; }
    .buy-box { margin: 16px 0 24px; }
    select.item-sel {
      width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--border);
      background: var(--card); color: var(--text); margin-bottom: 12px; font-size: 0.95rem;
    }
    .btn-buy {
      width: 100%; padding: 14px; border: none; border-radius: 12px;
      background: #374151; color: #fff; font-weight: 800; font-size: 1rem; cursor: pointer;
    }
    .btn-buy:not(:disabled) { background: var(--primary); }
    .btn-buy:disabled { opacity: 0.6; cursor: not-allowed; }
    .section { margin: 28px 0; }
    .section h2 {
      text-align: center; font-size: 1rem; letter-spacing: .06em;
      text-transform: uppercase; margin-bottom: 14px;
    }
    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px;
    }
    table.chars { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    table.chars td { padding: 12px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
    table.chars tr:last-child td { border-bottom: none; }
    table.chars td:first-child { color: var(--muted); width: 42%; font-weight: 600; }
    .desc { font-size: 0.92rem; line-height: 1.55; color: var(--muted); white-space: pre-wrap; }
    .q-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
    .q-item:last-child { border-bottom: none; }
    .q-user { display: flex; gap: 10px; align-items: flex-start; }
    .avatar {
      width: 36px; height: 36px; border-radius: 50%; background: var(--primary);
      color: #fff; display:flex; align-items:center; justify-content:center; font-weight: 700; flex-shrink: 0;
      overflow: hidden;
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .q-meta { font-size: 0.75rem; color: var(--muted); }
    .q-meta strong { color: var(--text); font-size: 0.88rem; }
    .q-text { margin-top: 4px; font-size: 0.9rem; }
    .q-reply { margin: 8px 0 0 46px; padding: 10px; background: rgba(124,58,237,.08); border-radius: 10px; }
    .ask-box textarea {
      width: 100%; min-height: 80px; border-radius: 10px; border: 1px solid var(--border);
      background: var(--bg); color: var(--text); padding: 12px; margin: 10px 0; resize: vertical;
    }
    .ask-row { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
    .hint-warn { font-size: 0.78rem; color: #f59e0b; flex: 1; }
    .btn-primary {
      background: var(--primary); color: #fff; border: none; border-radius: 10px;
      padding: 10px 16px; font-weight: 700; cursor: pointer;
    }
    .rating-big { text-align: center; padding: 8px 0 16px; }
    .rating-big .n { font-size: 2rem; font-weight: 800; }
    .stars { color: #fbbf24; letter-spacing: 2px; margin: 6px 0; }
    .rev-item { display: flex; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--border); }
    .rev-item:last-child { border-bottom: none; }
    .seller-card { text-align: center; padding: 20px 16px; }
    .seller-card .big-av { width:72px;height:72px;border-radius:50%;background:#7c3aed;color:#fff;display:flex;align-items:center;justify-content:center;font-size:1.6rem;font-weight:800;margin:0 auto 10px;overflow:hidden;padding:0; }
    .seller-card .big-av img { width:100%; height:100%; object-fit:cover; }
    .seller-card a.name {
      color: var(--primary); font-weight: 800; font-size: 1.05rem; text-decoration: none;
    }
    .on { display:inline-block; background:#22c55e; color:#fff; font-size:0.65rem; font-weight:800;
      padding:2px 6px; border-radius:999px; margin-left:6px; vertical-align:middle; }
    .seller-meta { font-size: 0.85rem; color: var(--muted); margin-top: 10px; line-height: 1.6; }
    .verify-row { display: flex; justify-content: space-between; padding: 8px 0; font-size: 0.9rem; border-bottom: 1px solid var(--border); }
    .verify-row:last-child { border-bottom: none; }
    .verify-row span:last-child { color: var(--ok); font-weight: 700; }
    .guarantee { text-align: center; padding: 20px; }
    .guarantee i { font-size: 1.6rem; color: var(--primary); margin-bottom: 8px; }
    .back { display:inline-block; margin-bottom: 12px; color: var(--muted); text-decoration:none; font-size:0.9rem; }
    .loading { text-align:center; padding: 48px 16px; color: var(--muted); }
  </style>
</head>
<body>
  <div class="top">
    <a class="logo" href="index.html"><div class="logo-i"><i class="fas fa-bolt"></i></div> Bloxzuh</a>
    <div class="top-actions">
      <a class="btn-announce" href="anunciar.html">Anunciar</a>
      <button class="icon-btn" type="button" onclick="location.href='favoritos.html'"><i class="fas fa-heart"></i></button>
      <button class="icon-btn" type="button" onclick="location.href='index.html'"><i class="fas fa-home"></i></button>
    </div>
  </div>

  <div class="wrap" id="page">
    <div class="loading">Carregando anúncio…</div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="js/firebase-auth.js"></script>
  <script src="js/firestore-db.js"></script>
  <script src="js/photos.js"></script>
  <script src="js/favs.js"></script>
  <script src="js/experimental.js"></script>
  <script src="js/notificacoes.js"></script>
  <script>
  (function () {
    if (localStorage.getItem('xinzuh-mode') === 'dark' || document.documentElement.getAttribute('data-mode') === 'dark') {
      document.documentElement.setAttribute('data-mode', 'dark');
    } else {
      document.documentElement.setAttribute('data-mode', localStorage.getItem('xinzuh-mode') || 'dark');
    }

    function esc(s) {
      return String(s || '').replace(/[&<>"']/g, function (c) {
        return ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' })[c];
      });
    }
    function money(n) {
      return 'R$ ' + (Number(n) || 0).toFixed(2).replace('.', ',');
    }
    function qKey(adId) { return 'bloxzuh-q-' + adId; }
    function getQuestions(adId) {
      try { return JSON.parse(localStorage.getItem(qKey(adId)) || '[]'); } catch (e) { return []; }
    }
    function saveQuestions(adId, list) {
      localStorage.setItem(qKey(adId), JSON.stringify(list));
    }

    async function main() {
      const page = document.getElementById('page');
      const id = (new URLSearchParams(location.search).get('id') || '').trim();
      if (!id) {
        page.innerHTML = '<p class="loading">Anúncio não encontrado. <a href="anuncios.html">Ver anúncios</a></p>';
        return;
      }
      let ad;
      try {
        ad = await fsGetAdById(id);
      } catch (e) {
        page.innerHTML = '<p class="loading">Erro ao carregar. Tente de novo.</p>';
        return;
      }
      if (!ad) {
        page.innerHTML = '<p class="loading">Anúncio não encontrado ou removido. <a href="anuncios.html">Ver anúncios</a></p>';
        return;
      }

      const raw = ad.raw || {};
      const stock = ad.stock || raw.stock || 1;
      const sales = ad.sales || 0;
      const vis = (ad.visibility || 'prata');
      const model = (ad.model || raw.model || 'normal');
      const sellerUid = raw.sellerUid || '';
      const sellerName = ad.seller || 'Vendedor';
      const currentUid = (firebase.auth().currentUser && firebase.auth().currentUser.uid) || '';
      const isOwner = !!(sellerUid && currentUid && sellerUid === currentUid);
      const initial = sellerName.charAt(0).toUpperCase();
      const favOn = typeof isFav === 'function' && isFav(ad.id);
      const cover = ad.cover
        ? '<img src="' + ad.cover + '" alt="">'
        : '<i class="fas fa-gamepad" style="font-size:3rem;color:#fff;opacity:.5"></i>';

      const chars = [
        ['Tipo do Anúncio', ad.productType || raw.productType || 'Conta'],
        ['Procedência', [raw.origin, raw.accountInfo].filter(Boolean).join(' > ') || '—'],
        ['Categoria', [ad.categoryLabel, raw.section].filter(Boolean).join(' > ') || ad.category],
        ['Modelo', model],
        ['Estoque', String(stock)],
        ['Visibilidade', vis]
      ];

      let questions = getQuestions(ad.id);
      // normalize old questions without timestamp
      questions = questions.map(function (q, i) {
        if (!q.createdAtMs) {
          if (typeof q.time === 'number') q.createdAtMs = q.time;
          else if (q.id && String(q.id).match(/^\d+$/)) q.createdAtMs = parseInt(q.id, 10);
          else q.createdAtMs = Date.now() - (i + 1) * 60000;
        }
        return q;
      });
      if (!questions.length && raw.faq && raw.faq.length) {
        questions = raw.faq.map(function (f, i) {
          return { id: 'faq' + i, user: 'FAQ',
            userUid: (firebase.auth().currentUser && firebase.auth().currentUser.uid) || "", text: f.q, reply: f.a, createdAtMs: Date.now() - (i + 1) * 3600000 };
        });
      }

      function renderQuestions() {
        if (!questions.length) {
          return '<p style="color:var(--muted);font-size:0.9rem">Nenhuma pergunta ainda.</p>';
        }
        return questions.map(function (q, idx) {
          var replyHtml = '';
          if (q.reply) {
            replyHtml = '<div class="q-reply"><div class="q-meta">' +
              (q.replyPhoto
                ? '<span class="avatar" style="width:22px;height:22px;padding:0;overflow:hidden;display:inline-block;vertical-align:middle;margin-right:6px;border-radius:50%"><img src="' + esc(q.replyPhoto) + '" style="width:100%;height:100%;object-fit:cover"></span>'
                : '<span class="avatar bz-seller-av" data-uid="' + esc(sellerUid) + '" style="width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;margin-right:6px;font-size:0.7rem">' + esc((sellerName||'V').charAt(0).toUpperCase()) + '</span>') +
              '<strong>' + esc(q.replyName || sellerName) + '</strong> · ' + esc(typeof timeAgo==='function' ? timeAgo(q.repliedAtMs || q.createdAtMs) : '') + '</div><div class="q-text">' + esc(q.reply) + '</div></div>';
          } else if (isOwner) {
            replyHtml = '<div class="q-reply"><textarea data-reply="' + idx + '" placeholder="Escreva sua resposta..." style="width:100%;min-height:60px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);padding:8px"></textarea>' +
              '<button type="button" class="btn-primary" style="margin-top:8px" data-send-reply="' + idx + '">Responder</button></div>';
          }
          return '<div class="q-item"><div class="q-user"><div class="avatar bz-q-av" data-uid="' + esc(q.userUid || q.userId || '') + '" data-photo="' + esc(q.userPhoto || '') + '" data-name="' + esc(q.user || '') + '">' + (q.userPhoto ? ('<img src="' + esc(q.userPhoto) + '" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:50%;display:block">') : esc((q.user || '?').charAt(0).toUpperCase())) + '</div><div>' +
            '<div class="q-meta"><strong>' + esc(q.user) + '</strong> · ' + esc(typeof timeAgo==='function' ? timeAgo(q.createdAtMs || q.time) : (q.time||'')) + '</div>' +
            '<div class="q-text">' + esc(q.text) + '</div>' + replyHtml +
            '</div></div></div>';
        }).join('');
      }

      page.innerHTML =
        '<a class="back" href="anuncios.html">← Voltar para anúncios</a>' +
        '<div class="cover">' + cover + '</div>' +
        '<div class="title-row">' +
          '<button type="button" class="fav-float' + (favOn ? ' is-fav' : '') + '" id="favBtn" data-id="' + esc(ad.id) + '"><i class="' + (favOn ? 'fas' : 'far') + ' fa-heart"></i></button>' +
          '<h1>' + esc(ad.title) + '</h1>' +
          '<div class="badges">' +
            '<span class="badge dim">' + esc(vis) + '</span>' +
            '<span class="badge">' + esc(model) + '</span>' +
            '<span class="badge">' + money(ad.price) + '</span>' +
          '</div>' +
        '</div>' +
        '<div class="stats">' +
          '<div class="stat"><div class="k">Disponíveis</div><div class="v plus">+' + stock + '</div></div>' +
          '<div class="stat"><div class="k">Vendidos</div><div class="v">' + sales + '</div></div>' +
          '<div class="stat"><div class="k">Vendas</div><div class="v">' + sales + '</div></div>' +
        '</div>' +
        '<div class="buy-box">' +
          (model === 'dinamico' ? '<select class="item-sel" id="itemSel"><option value="">Escolha um item</option><option value="1">Item padrão — ' + money(ad.price) + '</option></select>' : '') +
          (function(){
          var st = (ad.raw && ad.raw.status) || ad.status || 'ativo';
          var stock = Number((ad.raw && ad.raw.stock) != null ? ad.raw.stock : ad.stock);
          if (isNaN(stock)) stock = 1;
          var blocked = st === 'pausado' || st === 'vendido' || stock <= 0;
          if (blocked) {
            return '<button type="button" class="btn-buy" id="btnBuy" disabled style="opacity:.55;cursor:not-allowed;background:#4b5563">ANÚNCIO DESATIVADO</button>';
          }
          return '<button type="button" class="btn-buy" id="btnBuy"' + (model === 'dinamico' ? ' disabled' : '') + '>COMPRAR · ' + money(ad.price) + '</button>';
        })() +
        '</div>' +
        '<div class="section"><h2>Características</h2><div class="card"><table class="chars">' +
          chars.map(function (c) { return '<tr><td>' + esc(c[0]) + '</td><td>' + esc(c[1]) + '</td></tr>'; }).join('') +
        '</table></div></div>' +
        '<div class="section"><h2>Descrição do anúncio</h2><div class="card"><div class="desc">' + esc(ad.description || 'Sem descrição.') + '</div></div></div>' +
        '<div class="section"><h2>Perguntas</h2><div class="card" id="qList">' + renderQuestions() + '</div>' +
          (isOwner
            ? '<div class="card" style="margin-top:12px"><p style="color:var(--muted);font-size:0.9rem">Você é o vendedor. Responda as perguntas abaixo (não pode perguntar no próprio anúncio).</p></div>'
            : '<div class="card" style="margin-top:12px"><h3 style="font-size:0.95rem;margin-bottom:4px">Faça uma pergunta</h3>' +
              '<textarea id="qInput" placeholder="Digite sua pergunta aqui."></textarea>' +
              '<div class="ask-row"><p class="hint-warn">ATENÇÃO: não envie WhatsApp, Discord ou contatos externos.</p>' +
              '<button type="button" class="btn-primary" id="btnAsk">Perguntar</button></div></div>') +
        '</div>' +
        '<div class="section"><h2>Avaliações</h2><div class="card">' +
          '<div class="rating-big"><div class="n">5.0</div><div class="stars">★★★★★</div><div style="color:var(--muted);font-size:0.85rem">Ainda sem avaliações neste anúncio</div></div>' +
        '</div></div>' +
        '<div class="section"><div class="card seller-card">' +
          '<div class="big-av" id="sellerAv">' + initial + '</div>' +
          '<div><a class="name" href="perfil.html?uid=' + encodeURIComponent(sellerUid) + '&name=' + encodeURIComponent(sellerName) + '">' + esc(sellerName) + '</a>' +
          '<span class="on">ON</span></div>' +
          '<div class="seller-meta">Toque no nome para ver o perfil completo do vendedor</div>' +
          '<a class="btn-primary" style="display:inline-block;margin-top:14px;text-decoration:none" href="perfil.html?uid=' + encodeURIComponent(sellerUid) + '&name=' + encodeURIComponent(sellerName) + '">Ver perfil</a>' +
        '</div></div>' +
        '<div class="section"><h2>Verificações</h2><div class="card">' +
          '<div class="verify-row"><span>E-mail</span><span>Conta Bloxzuh</span></div>' +
          '<div class="verify-row"><span>Login</span><span>Verificado</span></div>' +
        '</div></div>' +
        '<div class="section"><div class="card guarantee"><i class="fas fa-shield-alt"></i><h3>Entrega garantida</h3><p style="color:var(--muted);font-size:0.9rem;margin-top:6px">Ou o seu dinheiro de volta (quando o pagamento protegido estiver ativo).</p></div></div>';

      // Fotos nas perguntas + vendedor
      (async function () {
        document.querySelectorAll('.bz-q-av').forEach(async function (el) {
          var uid = el.getAttribute('data-uid') || '';
          var name = el.getAttribute('data-name') || '?';
          var photo = '';
          if (uid && window.BloxzuhPhotos) photo = await BloxzuhPhotos.fetch(uid);
          if (photo) {
            el.innerHTML = '<img src="' + photo + '" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:50%;display:block">';
            el.style.padding = '0';
            el.style.overflow = 'hidden';
          }
        });
        // foto nas respostas do vendedor
        if (sellerUid && window.BloxzuhPhotos) {
          var sp = await BloxzuhPhotos.fetch(sellerUid);
          document.querySelectorAll('.q-reply').forEach(function (rep) {
            if (rep.querySelector('.bz-seller-av')) return;
            var meta = rep.querySelector('.q-meta');
            if (!meta) return;
            var av = document.createElement('div');
            av.className = 'bz-seller-av';
            av.style.cssText = 'display:inline-block;vertical-align:middle;margin-right:6px';
            av.innerHTML = window.BloxzuhPhotos.avatarHtml(sp, sellerName, 22);
            meta.insertBefore(av, meta.firstChild);
          });
        }
      })();
      
      (async function loadAllPhotos() {
        var photo = '';
        try {
          if (window.BloxzuhPhotos && sellerUid) photo = await BloxzuhPhotos.fetch(sellerUid);
          if (!photo && sellerUid) {
            var doc = await firebase.firestore().collection('profiles').doc(sellerUid).get();
            if (doc.exists && doc.data().photo) photo = doc.data().photo;
          }
        } catch (e) { console.warn('seller photo', e); }
        var av = document.getElementById('sellerAv');
        if (av && photo) {
          av.innerHTML = '<img src="' + photo + '" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:50%;display:block">';
          av.style.padding = '0';
          av.style.overflow = 'hidden';
          av.style.background = 'transparent';
        }
        var nodes = document.querySelectorAll('.bz-q-av');
        for (var qi = 0; qi < nodes.length; qi++) {
          (function(el){
            if (el.querySelector('img')) return;
            var uid = el.getAttribute('data-uid') || '';
            var ph = el.getAttribute('data-photo') || '';
            var go = async function() {
              if (!ph && uid && window.BloxzuhPhotos) {
                try { ph = await BloxzuhPhotos.fetch(uid); } catch(e){}
              }
              if (ph) {
                el.innerHTML = '<img src="' + ph + '" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:50%;display:block">';
                el.style.padding = '0';
                el.style.overflow = 'hidden';
              }
            };
            go();
          })(nodes[qi]);
        }
        document.querySelectorAll('.bz-seller-av').forEach(function(el) {
          if (photo && !el.querySelector('img')) {
            el.innerHTML = '<img src="' + photo + '" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:50%;display:block">';
            el.style.padding = '0';
            el.style.overflow = 'hidden';
          }
        });
      })();

      const favBtn = document.getElementById('favBtn');
      if (favBtn) {
        favBtn.onclick = function () {
          const on = toggleFav(ad.id, favBtn);
          favBtn.classList.toggle('is-fav', on);
          favBtn.innerHTML = '<i class="' + (on ? 'fas' : 'far') + ' fa-heart"></i>';
        };
      }
      const itemSel = document.getElementById('itemSel');
      const btnBuy = document.getElementById('btnBuy');
      if (itemSel && btnBuy) {
        itemSel.onchange = function () { btnBuy.disabled = !itemSel.value; };
      }
      if (btnBuy) {
        btnBuy.onclick = async function () {
          if (btnBuy.disabled) return;
          var st = (ad.raw && ad.raw.status) || ad.status || 'ativo';
          var stock = Number((ad.raw && ad.raw.stock) != null ? ad.raw.stock : ad.stock);
          if (st === 'pausado' || st === 'vendido' || stock <= 0) {
            alert('Este anúncio está desativado no momento.');
            return;
          }
          if (!firebase.auth().currentUser) {
            alert('Entre na sua conta para comprar.');
            location.href = 'login.html?redirect=' + encodeURIComponent(location.href);
            return;
          }
          location.href = 'checkout.html?adId=' + encodeURIComponent(ad.id);
        };
      }
      function bindReplyButtons() {
        document.querySelectorAll('[data-send-reply]').forEach(function (btn) {
          btn.onclick = function () {
            var idx = parseInt(btn.getAttribute('data-send-reply'), 10);
            var ta = document.querySelector('textarea[data-reply="' + idx + '"]');
            var text = (ta && ta.value || '').trim();
            if (!text) { alert('Digite a resposta.'); return; }
            questions[idx].reply = text;
            questions[idx].repliedAtMs = Date.now();
            questions[idx].replyName = sellerName;
            questions[idx].replyUid = sellerUid;
            try {
              questions[idx].replyPhoto = (window.BloxzuhPhotos && sellerUid)
                ? (BloxzuhPhotos.cache[sellerUid] || BloxzuhPhotos.getLocal(sellerUid) || '')
                : '';
            } catch (e1) { questions[idx].replyPhoto = ''; }
            // tenta buscar foto async e atualizar depois
            if (window.BloxzuhPhotos && sellerUid) {
              BloxzuhPhotos.fetch(sellerUid).then(function(ph) {
                if (ph) {
                  questions[idx].replyPhoto = ph;
                  saveQuestions(ad.id, questions);
                }
              });
            }
            saveQuestions(ad.id, questions);
            if (questions[idx].userId && typeof fsAddNotification === 'function') {
              fsAddNotification(questions[idx].userId, {
                type: 'resposta',
                title: 'O vendedor te respondeu no anúncio',
                body: ad.title + ': ' + text.slice(0, 120),
                link: 'anuncio.html?id=' + encodeURIComponent(ad.id),
                createdAtMs: Date.now()
              });
            }
            document.getElementById('qList').innerHTML = renderQuestions();
            bindReplyButtons();
          };
        });
      }
      bindReplyButtons();

      var btnAsk = document.getElementById('btnAsk');
      if (btnAsk) {
        btnAsk.onclick = function () {
          if (isOwner) { alert('O vendedor só pode responder perguntas.'); return; }
          const logged = localStorage.getItem('xinzuh-logged') === 'true';
          if (!logged) { alert('Entre na sua conta para perguntar.'); location.href = 'login.html'; return; }
          const text = (document.getElementById('qInput').value || '').trim();
          if (!text) { alert('Digite a pergunta.'); return; }
          if (/whatsapp|discord|instagram|@gmail|http/i.test(text)) {
            alert('Não é permitido enviar contatos externos.');
            return;
          }
          const user = localStorage.getItem('xinzuh-username') || 'Usuário';
          var askerUid = (firebase.auth().currentUser && firebase.auth().currentUser.uid) || '';
          var askerPhoto = '';
          try {
            askerPhoto = (window.BloxzuhPhotos && BloxzuhPhotos.getLocal(askerUid)) || localStorage.getItem('xinzuh-photo') || '';
          } catch (e0) {}
          questions.unshift({
            id: Date.now(),
            user: user,
            userUid: askerUid,
            userId: askerUid,
            userPhoto: askerPhoto,
            text: text,
            reply: '',
            createdAtMs: Date.now()
          });
          if (sellerUid && typeof fsAddNotification === 'function') {
            fsAddNotification(sellerUid, {
              type: 'pergunta',
              title: 'Nova pergunta no anúncio',
              body: user + ': ' + text.slice(0, 120),
              link: 'anuncio.html?id=' + encodeURIComponent(ad.id),
              createdAtMs: Date.now()
            });
          }
          saveQuestions(ad.id, questions);
          document.getElementById('qInput').value = '';
          document.getElementById('qList').innerHTML = renderQuestions();
          bindReplyButtons();
        };
      }

      // Wait for auth to refine isOwner if page loaded before auth ready
      firebase.auth().onAuthStateChanged(function (user) {
        if (user && sellerUid && user.uid === sellerUid && !isOwner) {
          // reload owner UI lightly
          location.reload();
        }
      });
    }
    main();
  })();
  </script>
</body>
</html>
